version: 2
updates:
  # =========================================================================
  # Unified Monorepo Workspace (pnpm)
  # Tracks all workspaces natively: api, backend, frontend, sdk, packages/*
  # =========================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Agrupa sólo minor y patch. Las mayores rompen APIs y llegan en PR propia,
    # una por paquete: un grupo con 83 subidas mezclaba TypeScript 7, tipos de
    # Node y Stripe nuevos y tumbaba seis jobs a la vez, sin forma de aislar cuál.
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint aún no soporta TS 7 y el job «ESLint Security Rules»
      # muere al cargar el parser. Quitar cuando lo soporte (issue #10940).
      - dependency-name: "typescript"
        versions: [">=7"]
    versioning-strategy: increase-if-necessary

  # =========================================================================
  # GitHub Actions
  # =========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"