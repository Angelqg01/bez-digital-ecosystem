name: Security Audit & Vulnerability Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security audit every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

# Cancel previous runs when new commits are pushed
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write
  issues: write

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ==========================================
  # 1. AUDITORÍA DE DEPENDENCIAS (todo el workspace)
  # ==========================================
  #
  # Antes esto era una matriz de tres jobs que parecía auditar cada paquete por
  # separado. Dos cosas iban mal, y cada una por sí sola bastaba para que el
  # check verde no significara lo que decía:
  #
  #   1. LAS ETIQUETAS NO CORRESPONDÍAN CON LO AUDITADO. El job llamado
  #      «NPM Security Audit (backend)» apuntaba a `api/`, que tiene UN fichero
  #      fuente; el llamado «(frontend)» apuntaba a `frontend-next/`, con 45.
  #      Los directorios `backend/` (440 ficheros) y `frontend/` (325) no
  #      aparecían en la matriz: 765 de los 811 ficheros del repositorio
  #      quedaban fuera, bajo dos checks verdes que llevaban sus nombres.
  #
  #   2. AUNQUE HUBIERAN CORRESPONDIDO, DABA IGUAL. Esto es un workspace de
  #      pnpm: `pnpm audit` resuelve desde el lockfile de la raíz y audita el
  #      workspace entero, sea cual sea el directorio desde el que se lance.
  #      Comprobado: los informes generados desde `api/`, `backend/` y
  #      `packages/mcp-server/` salen byte a byte idénticos (mismo sha256,
  #      135 544 bytes, 2576 dependencias). La matriz corría tres veces la
  #      misma auditoría y presentaba el resultado como tres comprobaciones
  #      distintas.
  #
  # Un solo job, con el nombre de lo que realmente hace. Cubre todos los
  # paquetes del workspace —`backend`, `frontend`, `frontend-next`, `api`,
  # `sdk` y `packages/*`— incluido `packages/mcp-server`, el único que se
  # publica a npm y cuyas vulnerabilidades viajan a quien lo instale.
  npm-security-audit:
    name: Auditoría de dependencias (workspace)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # pnpm antes que Node: `cache: 'pnpm'` de setup-node necesita que pnpm
      # ya esté instalado para localizar su almacén.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Sustituye a un `actions/cache` sobre `~/.npm` que no cacheaba nada:
          # ese es el almacén de npm, y aquí se instala con pnpm, que guarda lo
          # suyo en `~/.local/share/pnpm/store`. El paso se ejecutaba, salía
          # verde y no ahorraba una sola descarga.
          cache: 'pnpm'

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # `--frozen-lockfile`, no `--no-frozen-lockfile`.
      #
      # Una auditoría solo vale si mira exactamente las versiones que están
      # comprometidas. Con `--no-frozen-lockfile`, pnpm puede resolver otras
      # distintas y el informe pasa a describir un árbol que no es el del
      # repositorio. Si el lockfile está desincronizado, este paso falla: eso
      # es información, no un estorbo.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Auditar dependencias (informe JSON)
        id: npm-audit
        continue-on-error: true
        run: pnpm audit --json > npm-audit-report.json 2>&1 || true

      # «No he podido comprobarlo» no es «no hay vulnerabilidades».
      #
      # Cuando el endpoint de avisos no responde —un 503 del registro, por
      # ejemplo— `pnpm audit` escribe `{"error": {...}}`. Ese fichero no está
      # vacío y es JSON válido, así que pasaba los dos filtros anteriores; y
      # como no tiene `.metadata`, los `// 0` de más abajo lo convertían en
      # «critical=0, high=0, moderate=0» y el job salía VERDE sin haber
      # consultado un solo aviso. Comprobado con la carga real de un 503.
      - name: Comprobar que la auditoría llegó a ejecutarse
        run: |
          if [ ! -s npm-audit-report.json ]; then
            echo "::error::La auditoría de workspace no produjo informe."
            exit 1
          fi
          if ! jq empty npm-audit-report.json 2>/dev/null; then
            echo "::error::El informe de workspace no es JSON válido:"
            head -c 2000 npm-audit-report.json
            exit 1
          fi
          if jq -e 'has("error")' npm-audit-report.json >/dev/null 2>&1; then
            echo "::error::La auditoría de workspace NO pudo consultar los avisos:"
            jq -r '.error.message // .error' npm-audit-report.json
            exit 1
          fi
          if ! jq -e 'has("metadata")' npm-audit-report.json >/dev/null 2>&1; then
            echo "::error::El informe de workspace no trae metadata; no se puede contar nada."
            head -c 2000 npm-audit-report.json
            exit 1
          fi

      - name: Parse Audit Results
        id: parse-audit
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT

          echo "## 🔒 Security Audit - workspace" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- 🟠 High: $HIGH" >> $GITHUB_STEP_SUMMARY
          echo "- 🟡 Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-workspace
          path: ./npm-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on Critical Vulnerabilities
        if: steps.parse-audit.outputs.critical != '0' && steps.parse-audit.outputs.critical != ''
        run: |
          echo "❌ CRITICAL VULNERABILITIES DETECTED: ${{ steps.parse-audit.outputs.critical }}"
          echo "Blocking deployment. Please fix critical vulnerabilities before merging."
          exit 1

      - name: Warn on High Vulnerabilities
        if: steps.parse-audit.outputs.high != '0' && steps.parse-audit.outputs.high != ''
        run: |
          echo "⚠️  HIGH VULNERABILITIES DETECTED: ${{ steps.parse-audit.outputs.high }}"
          echo "Please review and fix high-severity vulnerabilities."

  # ==========================================
  # 2. SOLIDITY SMART CONTRACT AUDIT (Slither)
  # ==========================================
  solidity-security:
    name: Solidity Smart Contract Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for Contracts
        id: check-contracts
        run: |
          if [ -d "./src" ] && [ "$(find ./src -name '*.sol' | head -1)" ]; then
            echo "has_contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_contracts=false" >> "$GITHUB_OUTPUT"
            echo "## 🔒 Slither Security Analysis" >> $GITHUB_STEP_SUMMARY
            echo "No Solidity contracts found. Skipping analysis." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Install Foundry
        if: steps.check-contracts.outputs.has_contracts == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile Contracts
        if: steps.check-contracts.outputs.has_contracts == 'true'
        working-directory: ./
        run: forge build --sizes

      - name: Run Slither Analysis
        if: steps.check-contracts.outputs.has_contracts == 'true'
        id: slither
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        with:
          target: ./
          sarif: slither-results.sarif
          slither-args: >-
            --filter-paths "lib/|test/|script/"
            --detect reentrancy-eth,reentrancy-no-eth,arbitrary-send-eth,controlled-delegatecall,suicidal,uninitialized-state

      - name: Parse Slither Results
        if: steps.check-contracts.outputs.has_contracts == 'true'
        id: parse-slither
        run: |
          echo "high=0" >> $GITHUB_OUTPUT
          if [ -f "slither-results.sarif" ]; then
            echo "## 🔒 Slither Security Analysis" >> $GITHUB_STEP_SUMMARY
            echo "Slither static analysis completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "Check slither-results.sarif artifact for detailed findings." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Slither Report
        if: steps.check-contracts.outputs.has_contracts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slither-security-report
          path: slither-results.sarif
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================
  # 3. DEPENDENCY UPDATE CHECK
  # ==========================================
  dependency-update-check:
    name: Check for Outdated Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Check Frontend Dependencies
        working-directory: ./frontend-next
        continue-on-error: true
        run: |
          pnpm outdated --json > frontend-outdated.json 2>/dev/null || echo '{}' > frontend-outdated.json
          echo "## 📦 Frontend Outdated Packages" >> $GITHUB_STEP_SUMMARY
          if [ -s frontend-outdated.json ]; then
            jq -r 'to_entries[]? | "- \(.key): \(.value.current // "?") ➔ \(.value.latest // "?")"' frontend-outdated.json >> $GITHUB_STEP_SUMMARY || echo "No outdated packages" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Backend Dependencies
        working-directory: ./api
        continue-on-error: true
        run: |
          pnpm outdated --json > backend-outdated.json 2>/dev/null || echo '{}' > backend-outdated.json
          echo "## 📦 Backend Outdated Packages" >> $GITHUB_STEP_SUMMARY
          if [ -s backend-outdated.json ]; then
            jq -r 'to_entries[]? | "- \(.key): \(.value.current // "?") ➔ \(.value.latest // "?")"' backend-outdated.json >> $GITHUB_STEP_SUMMARY || echo "No outdated packages" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Outdated Reports
        uses: actions/upload-artifact@v4
        with:
          name: outdated-dependencies
          path: |
            ./frontend-next/frontend-outdated.json
            ./api/backend-outdated.json
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================
  # 4. CUSTOM SECURITY MONITOR
  # ==========================================
  security-monitor:
    name: CVE & Security Advisory Monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache Script Dependencies
        uses: actions/cache@v4
        with:
          path: scripts/node_modules
          key: scripts-deps-${{ hashFiles('scripts/package.json') }}
          restore-keys: scripts-deps-

      - name: Install Script Dependencies
        working-directory: scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Security Monitor Script
        id: security-monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_SECURITY_CHAT_ID }}
        working-directory: scripts
        run: |
          node securityMonitor.js || {
            echo '{"status":"error","message":"Security monitor script failed","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > security-report.json
          }

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-advisory-report
          path: scripts/security-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================
  # 5. CODE QUALITY & SECURITY LINTING
  # ==========================================
  eslint-security:
    name: ESLint Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Lo que había aquí escaneaba `frontend-next/src` y nada más: 45 ficheros
      # de los 928 de producción. Los 440 del backend y los 325 de `frontend/`
      # quedaban fuera, bajo un check verde llamado «ESLint Security Rules».
      #
      # Y aunque hubiera cubierto todo, no podía fallar: `continue-on-error`,
      # un `|| true` detrás de eslint y, si el fichero no salía, un
      # `echo '[]'` que convertía el fallo en «ningún hallazgo».
      #
      # Ahora cubre todo el código de producción y falla si encuentra algo de
      # la lista bloqueante. Las reglas están en `eslint.security.config.mjs`,
      # en la raíz, para que en local se ejecute exactamente lo mismo.
      # La cadena de ESLint vive en `tools/security-lint`, su propio paquete del
      # workspace, comprometida en el lockfile. No se instala aquí: un
      # `pnpm add` en la CI reescribiría el lockfile que `--frozen-lockfile`
      # acaba de exigir intacto, y traería la versión de ese día en vez de la
      # probada.
      #
      # Está aislada a propósito. ESLint 9 entre las dependencias de la raíz
      # rompe `next lint`: cambia la resolución de `eslint-config-next` y
      # `eslint-plugin-import` deja de ser alcanzable. Así, la raíz no lleva
      # ESLint, los frontales conservan el 8 para su propio lint, y estas
      # reglas usan el 9 que necesita la configuración plana.
      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Analizar el código de producción
        id: eslint-sec
        run: |
          set -uo pipefail

          # Sin `continue-on-error` ni `|| true`: si eslint no llega a producir
          # un informe, este paso falla. «No he podido mirarlo» no es «no hay
          # nada».
          # El binario sale del paquete aislado, pero se ejecuta desde la raíz
          # para que las rutas de abajo sean las del repositorio.
          ./tools/security-lint/node_modules/.bin/eslint \
            --no-config-lookup --config eslint.security.config.mjs \
            --format json --output-file eslint-security.json \
            --ignore-pattern '**/tests/**' \
            --ignore-pattern '**/__tests__/**' \
            --ignore-pattern '**/*.test.*' \
            --ignore-pattern '**/scripts/**' \
            backend frontend/src frontend-next/src packages/mcp-server/src api
          salida=$?

          if [ ! -s eslint-security.json ] || ! jq empty eslint-security.json 2>/dev/null; then
            echo "::error::ESLint no produjo un informe utilizable (salida $salida)."
            exit 1
          fi

          # Solo cuentan los hallazgos de los dos complementos de seguridad:
          # cualquier otra regla que llegue por un comentario en línea no debe
          # tumbar este job.
          bloqueantes=$(jq '[.[].messages[] | select(.severity == 2)
                             | select(.ruleId != null)
                             | select(.ruleId | test("^(security|no-unsanitized)/"))] | length' eslint-security.json)
          avisos=$(jq '[.[].messages[] | select(.severity == 1)
                        | select(.ruleId != null)
                        | select(.ruleId | test("^(security|no-unsanitized)/"))] | length' eslint-security.json)
          ficheros=$(jq 'length' eslint-security.json)

          {
            echo "## 🔒 Reglas de seguridad de ESLint"
            echo "- Ficheros analizados: $ficheros"
            echo "- 🔴 Bloqueantes: $bloqueantes"
            echo "- 🟡 Informativos: $avisos"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$bloqueantes" -gt 0 ]; then
            echo "::error::$bloqueantes hallazgo(s) de seguridad bloqueantes."
            jq -r '.[] | .filePath as $f | .messages[]
                   | select(.severity == 2 and .ruleId != null)
                   | select(.ruleId | test("^(security|no-unsanitized)/"))
                   | "\($f):\(.line)  \(.ruleId)  \(.message)"' eslint-security.json
            exit 1
          fi

          echo "Sin hallazgos bloqueantes en $ficheros ficheros."

      - name: Upload ESLint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-report
          path: ./eslint-security.json
          retention-days: 30
          if-no-files-found: ignore

  # ==========================================
  # 6. CODEQL ANALYSIS
  # ==========================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - node_modules
              - '**/node_modules'
              - frontend-next/dist
              - api/dist

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ==========================================
  # 7. CREATE SECURITY REPORT ISSUE
  # ==========================================
  create-security-report:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs:
      [
        npm-security-audit,
        solidity-security,
        dependency-update-check,
        security-monitor,
        eslint-security,
        codeql-analysis,
      ]
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./security-reports

      - name: Generate Security Report
        run: |
          echo "# 🛡️ Security Audit Report - $(date +'%Y-%m-%d')" > SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "## Summary" >> SECURITY_REPORT.md
          echo "Automated security scan completed. Review artifacts for details." >> SECURITY_REPORT.md
          echo "" >> SECURITY_REPORT.md
          echo "### Artifacts Generated:" >> SECURITY_REPORT.md
          if [ -d "security-reports" ]; then
            ls -R security-reports/ >> SECURITY_REPORT.md 2>/dev/null || echo "No artifacts found" >> SECURITY_REPORT.md
          else
            echo "No security reports directory found" >> SECURITY_REPORT.md
          fi

      - name: Create Issue on Critical Vulnerabilities
        if: |
          needs.npm-security-audit.result == 'failure' || 
          needs.solidity-security.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security,automated',
              state: 'open'
            });

            // Don't create duplicate issues
            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Security Vulnerabilities Detected - ' + new Date().toISOString().split('T')[0],
                body: `## Security Audit Failed\n\nCritical vulnerabilities detected in latest scan.\n\n**Run ID:** ${context.runId}\n**Workflow:** ${context.workflow}\n**Branch:** ${context.ref}\n\n**Action Required:** Review security reports and fix vulnerabilities before deployment.\n\n[View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                labels: ['security', 'critical', 'automated']
              });
            }
