# ===================================================
# BeZhas Web3 - CI/CD Pipeline for Google Cloud
# ===================================================
# This workflow handles:
# - Testing (Solidity, Backend, Frontend)
# - Building Docker images
# - Deploying to Cloud Run
# - Security scanning
# ===================================================

name: CI/CD Pipeline - GCP

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  REGION: us-central1
  BACKEND_SERVICE: bezhas-backend
  FRONTEND_SERVICE: bezhas-frontend
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===================================================
  # JOB 1: Lint and Security Scan
  # ===================================================
  lint-and-security:
    name: Lint & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-lint-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-lint-

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Lint frontend
        working-directory: ./frontend-next
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run lint
        continue-on-error: false

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

  # ===================================================
  # JOB 2: Smart Contract Tests
  # ===================================================
  #
  # Este job pasaba en verde sin probar nada. `forge test` recorre el proyecto
  # buscando ficheros `.t.sol` —las pruebas nativas de Foundry— y en este
  # repositorio no hay ninguno: ejecutaba cero pruebas y salía con código 0.
  # En los registros se ve claro: el paso «Run Foundry tests» duraba 0 segundos.
  #
  # Las pruebas de contrato que sí existen son de Hardhat: 208 repartidas en
  # diez ficheros de `test/`, y ningún workflow las ejecutaba. Cubren el token
  # BEZ, el puente entre cadenas, el oráculo de calidad, el marketplace, los
  # alquileres de NFT y el control de acceso. Ahora se ejecutan.
  #
  # `forge build` se queda: compila con la misma configuración que usan los
  # despliegues y detecta antes cualquier rotura de compilación.
  test-contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-contracts-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-contracts-

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      # Compilar 44 contratos con `viaIR` cuesta varios minutos. Se cachean los
      # artefactos y el compilador descargado, con la clave atada a los fuentes
      # y a la configuración: si cambia un `.sol`, la caché no se reutiliza.
      - name: Cache compilación de contratos
        uses: actions/cache@v4
        with:
          path: |
            cache
            artifacts
            ~/.cache/hardhat-nodejs
          key: solidity-${{ hashFiles('src/**/*.sol', 'hardhat.config.js', 'foundry.toml') }}
          restore-keys: solidity-

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile contracts (Foundry)
        run: forge build

      - name: Run contract tests (Hardhat)
        run: npx hardhat test

  # ===================================================
  # JOB 3: Backend Tests
  # ===================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
      # Buena parte del backend ya migró de Mongoose a DAOs de PostgreSQL
      # (pagos, ajustes globales, usuarios, puente). Sin este servicio, sus
      # pruebas de persistencia se saltan y el SQL de los DAOs no lo valida
      # nadie.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bezhas
          POSTGRES_PASSWORD: bezhas_password
          POSTGRES_DB: bezhas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bezhas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache backend dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-backend-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-backend-

      # Antes se instalaba y se probaba `./api`, un paquete con
      # `jest --passWithNoTests` y cero pruebas: el job pasaba en verde sin
      # ejecutar ni una de las 600 pruebas de `backend/`. Ahora se ejecutan
      # todas: ver backend/jest.ci.config.js.
      - name: Install backend dependencies
        working-directory: ./backend
        run: pnpm install --no-frozen-lockfile

      - name: Aplicar migraciones de PostgreSQL
        working-directory: ./backend
        env:
          PGPASSWORD: bezhas_password
        # En orden numérico y parando al primer error: si una migración se
        # rompe, es mejor saberlo aquí que descubrirlo en un despliegue.
        run: |
          for f in $(ls db/migrations/*.sql | sort); do
            echo "→ $f"
            psql -h localhost -p 5433 -U bezhas -d bezhas -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Run backend tests
        working-directory: ./backend
        run: pnpm run test:ci
        env:
          NODE_ENV: test
          MONGODB_URI: "mongodb://localhost:27017/bezhas_test"
          REDIS_URL: "redis://localhost:6379"
          DATABASE_URL: "postgresql://bezhas:bezhas_password@localhost:5433/bezhas"
          JWT_SECRET: test_jwt_secret_key_for_ci
          # Este job levanta MongoDB y PostgreSQL como servicios, así que las
          # pruebas que necesitan base de datos sí pueden ejecutarse aquí.
          RUN_DB_TESTS: "true"

  # ===================================================
  # JOB 3.5: MCP Server Tests
  # ===================================================
  #
  # `packages/mcp-server` tiene 206 pruebas repartidas en 17 ficheros y ningún
  # workflow las ejecutaba. Aparecía en la CI en un solo sitio: el job que lo
  # PUBLICA en npm, que además lo hacía sin probarlo.
  #
  # Es el mismo patrón que el #39, #40 y #41 curaron en el backend y en los
  # contratos: pruebas que existen, pasan, y no protegen nada porque nadie las
  # lanza. Aquí además el paquete se publica de cara al exterior, así que una
  # regresión no se queda en casa.
  test-mcp:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache MCP dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-mcp-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-mcp-

      - name: Install MCP dependencies
        working-directory: ./packages/mcp-server
        run: pnpm install --no-frozen-lockfile

      # El build va antes que las pruebas a propósito: si TypeScript no compila,
      # interesa saberlo por el error del compilador y no por veinte pruebas
      # fallando a la vez.
      - name: Build MCP Server
        working-directory: ./packages/mcp-server
        run: pnpm run build

      - name: Run MCP tests
        working-directory: ./packages/mcp-server
        run: pnpm test

  # ===================================================
  # JOB 4: Frontend Build & Test
  # ===================================================
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache frontend dependencies
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-frontend-${{ hashFiles('frontend-next/pnpm-lock.yaml') }}
          restore-keys: pnpm-frontend-

      - name: Install frontend dependencies
        working-directory: ./frontend-next
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend-next
        run: pnpm run build
        env:
          VITE_API_URL: https://api.bez.digital
          VITE_CHAIN_ID: "137"
          VITE_NETWORK: polygon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend-next/.next
            frontend-next/dist
          retention-days: 7

  # ===================================================
  # JOB 5: Build & Push Docker Images
  # ===================================================
  # ===================================================
  # JOB 4.5: ¿Está configurado el despliegue?
  # ===================================================
  #
  # Sin los secretos de Google Cloud, `google-github-actions/auth` aborta con
  # «must specify exactly one of workload_identity_provider or
  # credentials_json» y el pipeline entero sale en rojo. Lleva así desde antes
  # de que existiera este job: cada push a main pintaba una X que no informaba
  # de ninguna regresión, solo de que el despliegue nunca se llegó a configurar.
  #
  # Una señal que siempre está roja deja de leerse, igual que una que siempre
  # está verde deja de mirarse. Así que se separan los dos casos:
  #
  #   - Secretos ausentes  -> el despliegue se SALTA, con un aviso que dice
  #                           exactamente qué falta. No es un fallo: es que no
  #                           hay nada que desplegar todavía.
  #   - Secretos presentes -> el despliegue se ejecuta y cualquier fallo suyo
  #                           es un fallo de verdad, y sale en rojo como debe.
  #
  # Ojo con la condición de abajo: comprueba que los tres secretos existan. En
  # cuanto se configuren, este job deja de saltar nada y el pipeline recupera
  # su comportamiento normal sin tocar una línea.
  check-deploy-config:
    name: Comprobar configuración de despliegue
    runs-on: ubuntu-latest
    needs: [lint-and-security, test-contracts, test-backend, test-frontend, test-mcp]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    outputs:
      configurado: ${{ steps.comprobar.outputs.configurado }}

    steps:
      - name: Comprobar secretos de Google Cloud
        id: comprobar
        env:
          # Los secretos no se pueden leer en un `if:`, así que pasan por el
          # entorno. Solo se comprueba si están vacíos; nunca se imprimen.
          WIP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          faltan=""
          [ -z "$WIP" ]     && faltan="$faltan GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "$SA" ]      && faltan="$faltan GCP_SERVICE_ACCOUNT"
          [ -z "$PROJECT" ] && faltan="$faltan GCP_PROJECT_ID"

          if [ -n "$faltan" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Despliegue omitido: falta configuración"
              echo ""
              echo "No están definidos estos secretos del repositorio:"
              for s in $faltan; do echo "- \`$s\`"; done
              echo ""
              echo "Se definen en **Settings → Secrets and variables → Actions**."
              echo "El workflow usa Workload Identity Federation, así que no hace"
              echo "falta ninguna clave JSON de cuenta de servicio; los pasos para"
              echo "crear el proveedor están en \`docs/DESPLIEGUE_GCP.md\`."
              echo ""
              echo "Las pruebas de este commit sí se han ejecutado: lo único que"
              echo "se omite es construir y publicar las imágenes."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Despliegue omitido::Faltan secretos de GCP:$faltan — ver el resumen del job"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Configuración de Google Cloud presente; el despliegue continúa."
          fi

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-security, test-contracts, test-backend, test-frontend, test-mcp, check-deploy-config]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && needs.check-deploy-config.outputs.configurado == 'true'

    permissions:
      contents: read
      id-token: write

    outputs:
      backend_image: ${{ steps.build-backend.outputs.image }}
      frontend_image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and push backend image
        id: build-backend
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.BACKEND_SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE -f api/Dockerfile api/
          docker push $IMAGE
          docker tag $IMAGE ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.BACKEND_SERVICE }}:latest
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.BACKEND_SERVICE }}:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        id: build-frontend
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}"
          docker build -t $IMAGE -f frontend-next/Dockerfile frontend-next/ \
            --build-arg VITE_API_URL=https://api.bez.digital \
            --build-arg VITE_CHAIN_ID=137 \
            --build-arg VITE_NETWORK=polygon
          docker push $IMAGE
          docker tag $IMAGE ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.FRONTEND_SERVICE }}:latest
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/bezhas/${{ env.FRONTEND_SERVICE }}:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ===================================================
  # JOB 6: Deploy to Staging
  # ===================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.bez.digital

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Backend to Cloud Run (Staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}-staging
          region: ${{ env.REGION }}
          image: ${{ needs.build-images.outputs.backend_image }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --set-env-vars=NODE_ENV=staging
            --set-secrets=STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest

      - name: Deploy Frontend to Cloud Run (Staging)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}-staging
          region: ${{ env.REGION }}
          image: ${{ needs.build-images.outputs.frontend_image }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=3

  # ===================================================
  # JOB 7: Deploy to Production
  # ===================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
      url: https://bez.digital

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy Backend to Cloud Run (Production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-images.outputs.backend_image }}
          flags: |
            --allow-unauthenticated
            --min-instances=1
            --max-instances=100
            --memory=1Gi
            --cpu=2
            --concurrency=80
            --set-env-vars=NODE_ENV=production
            --set-secrets=MONGODB_URI=mongodb-uri:latest,REDIS_URL=redis-url:latest,JWT_SECRET=jwt-secret:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest

      - name: Deploy Frontend to Cloud Run (Production)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-images.outputs.frontend_image }}
          flags: |
            --allow-unauthenticated
            --min-instances=1
            --max-instances=50

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ BeZhas Production Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Production Deployment Complete*\n\n• Backend: `${{ env.BACKEND_SERVICE }}`\n• Frontend: `${{ env.FRONTEND_SERVICE }}`\n• Commit: `${{ github.sha }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  # ===================================================
  # JOB 8: Post-Deployment Verification
  # ===================================================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: success()

    steps:
      - name: Health check - Backend
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://api.bez.digital/api/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i: Backend returned $response, retrying..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Health check - Frontend
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://bez.digital || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i: Frontend returned $response, retrying..."
            sleep 10
          done
          echo "❌ Frontend health check failed"
          exit 1
