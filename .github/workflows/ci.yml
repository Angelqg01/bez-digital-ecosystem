name: CI

on:
  push:
    branches: [ main, master, develop, bezhas-blockchain-monorepo ]
  pull_request:
    branches: [ main, master, bezhas-blockchain-monorepo ]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm@11 (project standard, see package.json "packageManager") requires
  # Node >=22.13 — matches the node:22 base images used by the Dockerfiles.
  NODE_VERSION: "22"
  # Let Corepack fetch the pinned pnpm non-interactively (no CI prompt/hang).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # ==========================================
  # 0. Secret scan — blocking gate before anything else
  # ==========================================
  secret-scan:
    name: Secret Scan (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan for committed secrets
        run: node scripts/security/scan-secrets.cjs
      # Un `${VAR:-credencial}` en un compose versionado es una credencial
      # publicada: quien levante el stack sin .env inicializa los volúmenes con
      # ella, y Postgres/Grafana la fijan en el primer arranque para siempre.
      # Así fue como la contraseña real de la base acabó siendo el marcador de
      # posición de la documentación. No necesita .env: sólo lee el repositorio.
      - name: Check for credential defaults in compose files
        run: node scripts/security/check-compose-defaults.cjs

  build-and-test:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: secret-scan

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Corepack (bundled with Node 22) provides the exact pnpm pinned in
      # package.json "packageManager" (pnpm@11.0.0) and runs under the Node 22
      # set up above — unlike pnpm/action-setup, whose node20 runtime can't
      # satisfy pnpm@11's engines.node >=22.13.
      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Resolve pnpm store path
        shell: bash
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # --ignore-scripts: skip dependency build scripts (e.g. @scarf/scarf,
      # protobufjs) not needed for the unit/build gate; avoids pnpm@11's
      # ERR_PNPM_IGNORED_BUILDS when they are not pre-approved.
      - name: Install api dependencies
        working-directory: ./api
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install frontend dependencies
        working-directory: ./control-center/frontend
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install messaging-mcp dependencies
        working-directory: ./messaging-mcp
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ==========================================
      # 1. smart-contracts (Foundry)
      # ==========================================
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Solidity tests (Foundry)
        working-directory: ./smart-contracts
        run: forge test -vvv

      # ==========================================
      # 2. api backend (Jest unit tests)
      #    e2e/integration suites need a live chain (Anvil) + Postgres + Redis and
      #    run in a separate workflow/job, not in this fast unit gate.
      # ==========================================
      # `agent-lib` ya no tiene job propio: la Fase 5 lo absorbió en el
      # proceso de la API (api/services/agentRuntime.js). Sus agentes se
      # ejercitan ahora desde las suites de ./api, que son las que cubren el
      # contrato HTTP de /api/agents — el que de verdad consume el frontend.
      # No necesita red ni un bot real: intercepta fetch y levanta un doble de
      # la Bot API en localhost. Cubre la puerta de aprobación humana, que es la
      # parte con consecuencias.
      - name: Run messaging-mcp smoke test
        working-directory: ./messaging-mcp
        run: pnpm test

      - name: Run Backend API Tests (unit)
        working-directory: ./api
        run: pnpm run test:unit
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key-12345
          DATABASE_URL: "sqlite://:memory:"

      # ==========================================
      # 3. control-center/frontend (Next.js)
      # ==========================================
      # @agents/* and @bezhas/sdk resolve (tsconfig paths + webpack alias) to
      # ./modules/agents-ui and ./sdk inside the frontend — both are gitignored
      # and synced at build time (see scripts/gcp-deploy.sh). Mirror that here.
      - name: Sync shared modules into frontend
        run: |
          mkdir -p control-center/frontend/modules
          cp -r modules/agents-ui control-center/frontend/modules/agents-ui
          tar -cf - --exclude=node_modules --exclude=.git sdk | (cd control-center/frontend && tar -xf -)

      # Blocking: ESLint 9 flat config. The pre-existing backlog is downgraded
      # to warnings in eslint.config.mjs, so this fails only on NEW hard errors.
      - name: Lint frontend (blocking)
        working-directory: ./control-center/frontend
        run: pnpm run lint

      # Jest sobre auth y pagos del Control Center: contextos y hooks en jsdom,
      # y los route handlers de app/api/auth en runtime Node. Va antes del build
      # porque es mucho más rápido y falla por causas más claras.
      - name: Run frontend tests (unit)
        working-directory: ./control-center/frontend
        run: pnpm run test
        env:
          NODE_ENV: test

      - name: Build frontend
        working-directory: ./control-center/frontend
        run: pnpm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          if-no-files-found: ignore
          path: |
            control-center/frontend/.next
            control-center/frontend/dist

  # ==========================================
  # business-ops (OPERANT) — plano de operación de empresa
  #
  # Job aparte, y no un paso más del anterior, por dos motivos: necesita un
  # servicio Postgres (que en Actions es por job) y sus evals protegen el
  # COMPORTAMIENTO de los agentes, no el código. Regla heredada del proyecto:
  # ningún cambio de prompt entra sin pasar las evals.
  # ==========================================
  business-ops:
    name: business-ops (tests + evals + smoke)
    runs-on: ubuntu-latest
    needs: secret-scan

    # Postgres real para la batería de contrato del Store. Sin él, las pruebas
    # de PostgresStore se saltan y el adaptador de producción viaja sin red:
    # así se coló en su día que le faltaban métodos y que la RLS no aislaba.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: operant
          POSTGRES_PASSWORD: operant
          POSTGRES_DB: operant
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operant -d operant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # El contenedor de servicio no ejecuta el initdb con las migraciones
      # montadas (eso solo pasa con docker-compose), así que las aplica el runner.
      OWNER_DATABASE_URL: postgres://operant:operant@localhost:5432/operant
      PG_APP_PASSWORD: ci-app-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install business-ops dependencies
        working-directory: ./business-ops
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Migrar el esquema (con el rol dueño)
        working-directory: ./business-ops
        run: DATABASE_URL="$OWNER_DATABASE_URL" pnpm run db:migrate

      - name: Tests (sin Postgres — ruta por defecto de un despliegue pequeño)
        working-directory: ./business-ops
        run: pnpm test

      # La aplicación se conecta con operant_app, NUNCA con el dueño: un rol
      # superusuario se salta la RLS y el aislamiento entre tenants dejaría de
      # existir. PostgresStore se niega a arrancar si detecta ese caso.
      - name: Tests (contra Postgres, con el rol de aplicación)
        working-directory: ./business-ops
        run: DATABASE_URL="postgres://operant_app:${PG_APP_PASSWORD}@localhost:5432/operant" pnpm test

      - name: Evals de comportamiento (simulado, determinista)
        working-directory: ./business-ops
        run: pnpm run evals

      - name: Smoke end-to-end
        working-directory: ./business-ops
        run: pnpm run smoke
