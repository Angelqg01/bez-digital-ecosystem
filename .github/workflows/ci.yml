name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          # `~/.npm` es el almacén de npm; aquí se instala con pnpm, que guarda
          # lo suyo en `~/.local/share/pnpm/store`. Se deja solo el que sirve.
          path: ~/.local/share/pnpm/store
          key: pnpm-deps-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-deps-

      # Una instalación, no tres.
      #
      # Esto es un workspace de pnpm: `pnpm install` en la raíz instala todos
      # los paquetes —`backend`, `frontend`, `api`, `sdk` y
      # `packages/*`— desde el mismo lockfile. Las dos instalaciones que venían
      # después, en `api/` y en `frontend/`, repetían el mismo trabajo.
      #
      # Y `--frozen-lockfile`, no `--no-frozen-lockfile`: la CI tiene que
      # probar las versiones que están comprometidas. Si el lockfile está
      # desincronizado, este paso falla, que es justo lo que debe pasar.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ==========================================
      # 1. smart-contracts (Foundry at root)
      # ==========================================
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # `forge test` no probaba nada: busca ficheros `.t.sol` y este repositorio
      # no tiene ninguno, así que ejecutaba cero pruebas y salía con código 0.
      # Las pruebas de contrato reales son de Hardhat, en `test/`.
      - name: Compile contracts (Foundry)
        working-directory: ./
        run: forge build

      - name: Run contract tests (Hardhat)
        working-directory: ./
        run: npx hardhat test

      # ==========================================
      # 2. api backend (Jest)
      # ==========================================
      - name: Run Backend API Tests
        working-directory: ./api
        run: pnpm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-key-12345
          DATABASE_URL: "sqlite://:memory:"

      # ==========================================
      # 3. frontend (Vite) — el frontend oficial de www.bezhas.com
      # ==========================================
      # El lint heredado de `frontend/` tiene errores anteriores (115) que se irán saneando:
      # no bloquea, pero se informa. La seguridad (ESLint de seguridad y CodeQL) sí bloquea en sus jobs.
      - name: Lint frontend (informativo)
        working-directory: ./frontend
        continue-on-error: true
        run: pnpm run lint

      # Pruebas del chat/acciones (bloquean). El resto de la suite se informa: `critical-routes` tiene
      # 2 fallos anteriores (DAOPage y StakingPage, rutas migradas a otras apps).
      - name: Test frontend (chat y acciones)
        working-directory: ./frontend
        run: pnpm exec vitest run src/lib src/utils src/hooks src/components/AI

      - name: Test frontend (suite completa, informativo)
        working-directory: ./frontend
        continue-on-error: true
        run: pnpm exec vitest run

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
        env:
          VITE_API_URL: https://api.bezhas.com

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          if-no-files-found: ignore
          path: |
            frontend/dist
