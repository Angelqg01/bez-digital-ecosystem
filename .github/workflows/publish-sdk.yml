name: Publish SDK to npm

# ──────────────────────────────────────────────────────────────────────────────
# Disparadores:
#   - Automático: una etiqueta `sdk/v*`
#   - Manual:     workflow_dispatch, con opción de prelanzamiento y de ensayo
# ──────────────────────────────────────────────────────────────────────────────
#
# Este fichero publica paquetes a un registro público. Lo que se sube no se
# puede retirar sin dejar rastro, así que cada barrera de abajo está para que
# no salga nada que no debería.
#
# Lo que había antes y por qué ya no está:
#
#   · `publish-pnpm` volvía a publicar @bezhas/sdk en el MISMO registro justo
#     después de que `publish-npm` lo hubiera publicado, con la misma versión.
#     El registro rechaza una versión repetida (EPUBLISHCONFLICT), así que ese
#     job no podía terminar en verde nunca. Se ha eliminado: una publicación,
#     hecha con pnpm, que es lo que usa este repositorio.
#
#   · `publish-npm` no instalaba pnpm y luego ejecutaba `pnpm install`. Habría
#     fallado con «pnpm: command not found» en la primera publicación real.
#
#   · `github-release` leía `needs.validate.outputs.sdk_version` sin tener
#     `validate` entre sus `needs`. El contexto `needs` solo trae los jobs de
#     los que se depende, así que ese valor llegaba VACÍO y el lanzamiento se
#     habría creado con el nombre «@bezhas/sdk v».
#
#   · Los `pnpm install --no-frozen-lockfile` y los `|| pnpm install` de
#     recambio permitían publicar un árbol de dependencias distinto del
#     comprometido, y se tragaban el fallo del primer intento.

on:
  push:
    tags:
      - 'sdk/v*'          # p. ej. sdk/v2.0.1, sdk/v3.0.0-beta.1
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar como prelanzamiento (beta)'
        type: boolean
        default: false
      dry_run:
        description: 'Ensayo: no publica nada'
        type: boolean
        default: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write   # Para crear el lanzamiento en GitHub

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Validar y construir
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validar y construir
    runs-on: ubuntu-latest
    outputs:
      sdk_version: ${{ steps.version.outputs.sdk_version }}
      mcp_version: ${{ steps.version.outputs.mcp_version }}
      sdk_publicable: ${{ steps.version.outputs.sdk_publicable }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        # @chainlink/contracts declara @zksync/contracts con una URL SSH
        # (git@github.com:matter-labs/era-contracts.git). El runner no tiene
        # clave SSH, así que sin esta reescritura `pnpm install` falla con
        # "Permission denied (publickey)" en cuanto el lockfile fija esa URL.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # ─────────────────────────────────────────────────────────────────────
      # La barrera que faltaba: no publicar un marcador de posición.
      #
      # `sdk/` NO contiene el SDK. Es un stub declarado como tal: versión
      # `0.0.0-placeholder`, sin scripts, y un `index.js` cuyo proxy devuelve
      # `undefined` para cualquier método que se le pida. Existe solo para que
      # `frontend-next` resuelva su `import { BeZhasSDK }` y el workspace
      # instale.
      #
      # Publicarlo con el nombre real sería peor que no publicar nada: quien
      # instalara @bezhas/sdk obtendría un paquete que no falla, simplemente
      # no hace nada, y los errores aparecerían lejos de aquí.
      #
      # Este paso decide si el SDK es publicable. Si no lo es, el job sigue
      # —el servidor MCP sí se publica— pero el SDK se salta con un aviso.
      # ─────────────────────────────────────────────────────────────────────
      - name: Determinar versiones y si el SDK es publicable
        id: version
        run: |
          set -euo pipefail

          SDK_VERSION=$(node -p "require('./sdk/package.json').version")
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

          MCP_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          echo "mcp_version=$MCP_VERSION" >> "$GITHUB_OUTPUT"

          motivo=""
          case "$SDK_VERSION" in
            *placeholder*|0.0.0*) motivo="la versión es $SDK_VERSION" ;;
          esac

          if [ -z "$motivo" ] && grep -qi 'placeholder' sdk/package.json; then
            motivo="package.json se declara PLACEHOLDER"
          fi

          if [ -z "$motivo" ] && ! node -e "
            const s = require('./sdk/package.json').scripts || {};
            process.exit(s.build ? 0 : 1);
          "; then
            motivo="no tiene script de build"
          fi

          if [ -n "$motivo" ]; then
            echo "sdk_publicable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se publicará @bezhas/sdk: $motivo."
            echo "El directorio sdk/ es un marcador de posición, no el SDK real."
          else
            echo "sdk_publicable=true" >> "$GITHUB_OUTPUT"
            echo "📦 @bezhas/sdk@$SDK_VERSION"
          fi

          echo "📦 @bezhas/mcp-server@$MCP_VERSION"

      # `--frozen-lockfile`: lo que se publica tiene que construirse con las
      # versiones comprometidas, no con las que pnpm resuelva ese día.
      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile

      - name: Construir el SDK
        if: steps.version.outputs.sdk_publicable == 'true'
        run: pnpm --filter @bezhas/sdk run build

      - name: Probar el SDK
        if: steps.version.outputs.sdk_publicable == 'true'
        run: |
          set -euo pipefail
          # `--if-present` es una bandera de npm; pnpm se la pasaría al script
          # y el script abortaría. Se decide aquí, con node, si hay que correr.
          if node -e "const s=require('./sdk/package.json').scripts||{};process.exit(s.test?0:1)"; then
            pnpm --filter @bezhas/sdk run test
          else
            echo "::warning::@bezhas/sdk no declara script de test."
          fi

      - name: Subir artefactos del SDK
        if: steps.version.outputs.sdk_publicable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: |
            sdk/dist/
            sdk/index.js
            sdk/index.d.ts
            sdk/package.json
            sdk/README.md
          retention-days: 1
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Publicar @bezhas/sdk
  # ────────────────────────────────────────────────────────────────────────────
  publish-sdk:
    name: Publicar @bezhas/sdk
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.sdk_publicable == 'true'
    environment: npm-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile

      - name: Descargar artefactos del SDK
        uses: actions/download-artifact@v4
        with:
          name: sdk-build
          path: sdk/

      - name: Comprobar que el paquete lleva lo que dice llevar
        # Si el fichero que `main` declara no acaba en el tarball, el paquete
        # está roto aunque todo lo anterior haya salido verde.
        working-directory: sdk
        run: |
          set -euo pipefail
          ficheros=$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(f=>f.path).join('\n')")
          principal=$(node -p "require('./package.json').main")
          if ! echo "$ficheros" | grep -qx "$principal"; then
            echo "::error::El paquete declara main=$principal pero ese fichero no está en el tarball."
            echo "$ficheros" | head -20
            exit 1
          fi
          echo "OK: $principal está en el paquete."

      - name: Etiqueta de npm
        id: npm_tag
        run: |
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        working-directory: sdk
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm publish --dry-run --access public --no-git-checks --tag ${{ steps.npm_tag.outputs.tag }}
            echo "🔍 Ensayo terminado — no se ha publicado nada"
          else
            pnpm publish --access public --no-git-checks --tag ${{ steps.npm_tag.outputs.tag }}
            echo "✅ Publicado @bezhas/sdk@${{ needs.validate.outputs.sdk_version }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Publicar @bezhas/mcp-server
  # ────────────────────────────────────────────────────────────────────────────
  publish-mcp:
    name: Publicar @bezhas/mcp-server
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.mcp_version != ''
    environment: npm-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Usar HTTPS para dependencias git alojadas en GitHub
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Instalar dependencias del workspace
        run: pnpm install --frozen-lockfile

      # OJO con lo que había aquí: `pnpm run build --if-present`.
      #
      # `--if-present` es una bandera de npm, no de pnpm, así que pnpm se la
      # pasaba tal cual a tsc, que abortaba con «error TS5023: Unknown compiler
      # option». El `||` caía entonces a `tsc --noEmit`, que comprueba tipos
      # pero NO genera nada. El paso salía con código 0 y `dist/` no existía.
      #
      # Resultado: se publicaba en npm un paquete que declara
      # `main: dist/index.js` sin ningún dist/, y con 49 fuentes .ts y 18
      # ficheros de prueba dentro. Quien lo instalara no podía ni importarlo.
      - name: Construir el servidor MCP (TypeScript)
        run: pnpm --filter @bezhas/mcp-server run build

      # Y antes de publicar, las pruebas. Había 206 escritas y ninguna se
      # ejecutaba en el camino de publicación: se subía a npm a ciegas.
      - name: Probar el servidor MCP
        run: pnpm --filter @bezhas/mcp-server run test

      - name: Comprobar que el paquete lleva lo que dice llevar
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          ficheros=$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(f=>f.path).join('\n')")
          principal=$(node -p "require('./package.json').main")
          if ! echo "$ficheros" | grep -qx "$principal"; then
            echo "::error::El paquete declara main=$principal pero ese fichero no está en el tarball."
            echo "$ficheros" | head -20
            exit 1
          fi
          echo "OK: $principal está en el paquete."

      - name: Publicar
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm publish --dry-run --access public --no-git-checks
            echo "🔍 Ensayo terminado — no se ha publicado nada"
          else
            pnpm publish --access public --no-git-checks
            echo "✅ Publicado @bezhas/mcp-server@${{ needs.validate.outputs.mcp_version }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Lanzamiento en GitHub
  # ────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Crear lanzamiento en GitHub
    runs-on: ubuntu-latest
    # `validate` tiene que estar aquí: el contexto `needs` solo trae los jobs
    # de los que se depende. Sin él, `needs.validate.outputs.*` llega vacío.
    needs: [validate, publish-sdk, publish-mcp]
    # `always()` con la comprobación explícita: el lanzamiento se crea aunque
    # el SDK se haya saltado por ser un marcador de posición, pero NO si algo
    # ha fallado de verdad.
    if: |
      always()
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
      && needs.validate.result == 'success'
      && needs.publish-mcp.result == 'success'
      && (needs.publish-sdk.result == 'success' || needs.publish-sdk.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear lanzamiento
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "@bezhas/mcp-server v${{ needs.validate.outputs.mcp_version }}"
          generate_release_notes: true
          body: |
            ## Paquetes de esta etiqueta

            - `@bezhas/mcp-server@${{ needs.validate.outputs.mcp_version }}` — publicado
            - `@bezhas/sdk@${{ needs.validate.outputs.sdk_version }}` — ${{ needs.publish-sdk.result == 'success' && 'publicado' || 'NO publicado (sdk/ es un marcador de posición en este repositorio)' }}

            ### Instalación

            ```bash
            pnpm add @bezhas/mcp-server@${{ needs.validate.outputs.mcp_version }}
            ```

            ### Qué incluye el servidor MCP

            - Herramientas MCP para blockscout, github, tally, firecrawl, alpaca y pagos
            - Polygon mainnet y Amoy
            - Cotizaciones contra oráculo de mercado, con procedencia y caducidad
