# ──────────────────────────────────────────────────────
#  BeZhas Nginx — Reverse Proxy + TLS + WAF
# ──────────────────────────────────────────────────────
#  Expects SSL certs mounted at /etc/nginx/ssl/
#  Self-signed for dev:
#    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#      -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem \
#      -subj "/CN=bezhas.local"
# ──────────────────────────────────────────────────────

# ── Rate-limit zones ────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── WAF: Block known bad patterns ───────────────────
map $request_uri $block_uri {
    default 0;
    # Entrecomillado y con la barra duplicada a proposito. Sin comillas,
    # nginx entrega a PCRE `(\.\./|\.\.\)`: el `\)` queda como parentesis
    # escapado, el grupo nunca cierra y nginx aborta con "missing closing
    # parenthesis". Comillas + `\\\\` hacen que PCRE reciba `\\`, que es la
    # barra invertida literal que se queria bloquear.
    "~*(\.\./|\.\.\\\\)"           1;   # path traversal (../ y ..\)
    ~*(<script|%3Cscript)          1;   # XSS
    ~*(union\s+select|insert\s+into|drop\s+table|update\s+.*set) 1;  # SQLi
    ~*(/etc/passwd|/proc/self)     1;   # LFI
    ~*(\.php|\.asp|\.jsp|\.cgi)$   1;   # unwanted extensions
    ~*(wp-admin|wp-login|xmlrpc)   1;   # WordPress probes
}

map $http_user_agent $block_agent {
    default 0;
    ~*(sqlmap|nikto|nessus|havij|acunetix|nmap) 1;   # scanner bots
    ""                                           1;   # empty UA
}

# ── HTTP → HTTPS redirect ───────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ───────────────────────────────
server {
    # `listen ... http2` esta obsoleto desde nginx 1.25 y ya avisa en el 1.27
    # que usa la imagen. Se separa antes de que pase de aviso a error.
    listen 443 ssl;
    http2 on;
    server_name bezhas.local;

    # ── TLS ──────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:;" always;

    # ── Destinos ─────────────────────────────────────
    #
    # 127.0.0.11 es el DNS interno de Docker. Va con variables A PROPOSITO:
    # un `proxy_pass http://host:puerto` literal se resuelve al cargar la
    # configuracion, y si UN solo host no existe nginx no arranca. Media
    # plataforma caia por un servicio que aun no esta desplegado.
    #
    # Con variables la resolucion es por peticion: lo que no exista devuelve
    # 502 en su propia ruta y el resto del borde sigue sirviendo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $up_api      http://bezhas-api:3001;   # el base lo llama bezhas-api
    set $up_frontend http://control-center:3000;
    set $up_defi     http://defi-frontend:5174/;
    set $up_aegis    http://aegis:8001;
    set $up_ai       http://ai-gateway:3002;
    set $up_grafana  http://grafana:3000/;

    # ── WAF enforcement ──────────────────────────────
    if ($block_uri)   { return 403; }
    if ($block_agent) { return 403; }

    # Block request bodies larger than 10 MB
    client_max_body_size 10m;

    # ── Connection limits ────────────────────────────
    limit_conn conn_limit 20;

    # ── Frontend (Next.js) ───────────────────────────
    location / {
        proxy_pass $up_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Auth endpoints (stricter rate limit) ─────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Gateway API (cross-app SSO + services) ───────
    location /api/gateway/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass $up_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── DeFi App Frontend ────────────────────────────
    location /defi/ {
        proxy_pass $up_defi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Aegis AI ─────────────────────────────────────
    location /aegis/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass $up_aegis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AI Gateway (MCP) ────────────────────────────
    location /ai/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass $up_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Grafana (monitoring) ─────────────────────────
    location /grafana/ {
        proxy_pass $up_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block Prometheus/metrics from public access ──
    location /api/metrics {
        deny all;
        return 403;
    }

    location /metrics {
        deny all;
        return 403;
    }

    # ── Health check ─────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
