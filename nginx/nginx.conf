# ──────────────────────────────────────────────────────
#  BeZhas Nginx — Reverse Proxy + TLS + WAF
# ──────────────────────────────────────────────────────
#  Expects SSL certs mounted at /etc/nginx/ssl/
#  Self-signed for dev:
#    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#      -keyout nginx/ssl/privkey.pem -out nginx/ssl/fullchain.pem \
#      -subj "/CN=bezhas.local"
# ──────────────────────────────────────────────────────

# ── Rate-limit zones ────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── WAF: Block known bad patterns ───────────────────
map $request_uri $block_uri {
    default 0;
    ~*(\.\./|\.\.\\)               1;   # path traversal
    ~*(<script|%3Cscript)          1;   # XSS
    ~*(union\s+select|insert\s+into|drop\s+table|update\s+.*set) 1;  # SQLi
    ~*(/etc/passwd|/proc/self)     1;   # LFI
    ~*(\.php|\.asp|\.jsp|\.cgi)$   1;   # unwanted extensions
    ~*(wp-admin|wp-login|xmlrpc)   1;   # WordPress probes
}

map $http_user_agent $block_agent {
    default 0;
    ~*(sqlmap|nikto|nessus|havij|acunetix|nmap) 1;   # scanner bots
    ""                                           1;   # empty UA
}

# ── HTTP → HTTPS redirect ───────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name bezhas.local;

    # ── TLS ──────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-XSS-Protection          "1; mode=block"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:;" always;

    # ── WAF enforcement ──────────────────────────────
    if ($block_uri)   { return 403; }
    if ($block_agent) { return 403; }

    # Block request bodies larger than 10 MB
    client_max_body_size 10m;

    # ── Connection limits ────────────────────────────
    limit_conn conn_limit 20;

    # ── Frontend (Next.js) ───────────────────────────
    location / {
        proxy_pass http://control-center:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Auth endpoints (stricter rate limit) ─────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Gateway API (cross-app SSO + services) ───────
    location /api/gateway/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── DeFi App Frontend ────────────────────────────
    location /defi/ {
        proxy_pass http://defi-frontend:5174/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Aegis AI ─────────────────────────────────────
    location /aegis/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://aegis:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AI Gateway (MCP) ────────────────────────────
    location /ai/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://ai-gateway:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Grafana (monitoring) ─────────────────────────
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block Prometheus/metrics from public access ──
    location /api/metrics {
        deny all;
        return 403;
    }

    location /metrics {
        deny all;
        return 403;
    }

    # ── Health check ─────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
