# ============================================================
# Nota sobre recursos:
#   Los 10 agentes departamentales juntos consumen aprox:
#   - CPU: < 5% promedio (ciclos async, no blocking)
#   - RAM: ~150-250 MB adicionales en el contenedor aegis
#   - Redis: ~2-5 MB de datos de estado y alertas
#
#   No requieren GPU — la GTX 1080 sigue siendo usada
#   exclusivamente por los modelos ML de Aegis.
