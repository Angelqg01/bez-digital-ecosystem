<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BeZhas · Cómo funciona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
:root{--bg:#06080d;--panel:#0d121b;--line:#1d2635;--teal:#00D4AA;--gold:#FFD700;--pink:#FF6B9D;--txt:#e9eef5;--mut:#8a97aa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0}
.orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.28}
#grid{position:absolute;inset:-100px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px}
#scene{position:absolute;inset:0;padding:150px 140px 190px}
h1,h2,h3,.syne{font-family:Syne,sans-serif}
.mono{font-family:'Space Mono',monospace}
#top{position:absolute;left:140px;right:140px;top:56px;display:flex;align-items:center;gap:22px;z-index:5}
#chap{font-family:'Space Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
#bar{flex:1;height:4px;background:#ffffff14;border-radius:4px;overflow:hidden}
#barin{height:100%;background:linear-gradient(90deg,var(--teal),var(--pink))}
#brand{display:flex;align-items:center;gap:12px;font-family:Syne;font-weight:800;font-size:26px}
#cap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);max-width:1500px;text-align:center;font-size:33px;line-height:1.35;font-weight:500;background:rgba(6,8,13,.72);padding:14px 30px;border-radius:14px;border:1px solid #ffffff12;z-index:5}
.kicker{font-family:'Space Mono';color:var(--teal);font-size:24px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px}
.h{font-size:64px;font-weight:800;line-height:1.08;margin-bottom:44px}
.h em{font-style:normal;background:linear-gradient(90deg,var(--teal),var(--pink));-webkit-background-clip:text;color:transparent}
.card{background:linear-gradient(180deg,#111826,#0b1018);border:1px solid var(--line);border-radius:22px}
.pill{display:inline-block;padding:8px 18px;border-radius:999px;font-family:'Space Mono';font-size:19px;border:1px solid #00d4aa55;color:var(--teal);background:#00d4aa12}
.pill.gold{border-color:#ffd70066;color:var(--gold);background:#ffd70012}
.pill.pink{border-color:#ff6b9d66;color:var(--pink);background:#ff6b9d12}
.demo{position:absolute;right:18px;bottom:14px;font-family:'Space Mono';font-size:14px;color:#8a97aa99}
.aside{font-size:19px;color:var(--mut);margin-top:22px;font-style:italic}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div id="grid"></div><div class="orb" id="o1" style="width:900px;height:900px;background:var(--teal)"></div><div class="orb" id="o2" style="width:800px;height:800px;background:var(--pink)"></div><div class="orb" id="o3" style="width:600px;height:600px;background:var(--gold);opacity:.12"></div></div>
  <div id="top"><div id="chap"></div><div id="bar"><div id="barin"></div></div><div id="brand"><span id="logo1"></span>BeZhas</div></div>
  <div id="scene"></div>
  <div id="cap"></div>
</div>
<script>
const LOGO=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#FF6B9D"/><path d="M50 2a48 48 0 0 1 0 96a24 24 0 0 1 0-48a24 24 0 0 0 0-48z" fill="#00D4AA"/><circle cx="50" cy="26" r="7" fill="#FF6B9D"/><circle cx="50" cy="74" r="7" fill="#00D4AA"/></svg>`;
document.getElementById('logo1').innerHTML=LOGO(38);
let L={demo:'Datos de demostración',sector:'Caso de uso por sector',rec:'Plan recomendado',role:'Para el cargo de',bot:'${L.bot}'};
const EN={demo:'Demo data',sector:'Industry use case',rec:'Recommended plan',role:'For the role of',bot:'Assistant · BeZhas MCP'};
const K=(r,k,d)=>(r.s.keys&&r.s.keys[k]!==undefined)?r.s.keys[k]:d;
let SC=[],DUR={},TL=[],TOTAL=0,LEAD=0.6,TAIL=0.9,built=-1;
const cl=(x)=>Math.max(0,Math.min(1,x)), ease=(x)=>1-Math.pow(1-cl(x),3);
function setup(scenes,dur,lang){if(lang==='en'){L=EN;document.documentElement.lang='en'}SC=scenes;DUR=dur;let t=0;TL=SC.map(s=>{const d=DUR[s.id]+LEAD+TAIL;const r={s,start:t,len:d,audio:DUR[s.id]};t+=d;return r});TOTAL=t;return {total:t,lead:LEAD,tl:TL.map(r=>({id:r.s.id,start:r.start,len:r.len}))}}
// Momento (s, relativo a la escena) en que la narración menciona un texto
function at(r,word,i,n){const txt=r.s.say.toLowerCase();let p=word?txt.indexOf(word.toLowerCase()):-1;if(p<0)return LEAD+0.4+(i/(n))*r.audio*0.8;return LEAD+(p/txt.length)*r.audio-0.2}
const A=(d,extra='')=>`class="in ${extra}" data-d="${d.toFixed(2)}"`;
function bullets(r,pts,key){return pts.map((p,i)=>`<div ${A(at(r,null,i+1,pts.length+1))} style="display:flex;gap:18px;align-items:flex-start;font-size:31px;line-height:1.3;margin:0 0 22px"><span style="color:var(--teal);font-weight:700">▸</span><span>${p}</span></div>`).join('')}
function chart(data,id){const w=520,h=170,bw=w/data.length;return `<svg width="${w}" height="${h}" class="chart">${data.map((v,i)=>`<rect class="gb" data-d="${(1.4+i*0.15).toFixed(2)}" data-h="${v/10*h}" x="${i*bw+8}" width="${bw-16}" y="${h}" height="0" rx="6" fill="url(#g${id})"/>`).join('')}<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D4AA"/><stop offset="1" stop-color="#00D4AA22"/></linearGradient></defs></svg>`}
const B={
 title(r){const s=r.s;return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><div ${A(0.2)} style="margin-bottom:40px" id="biglogo">${LOGO(130)}</div><div ${A(0.6,'kicker')}>${s.kicker}</div><h1 ${A(1.0,'h')} style="font-size:78px">${s.title}</h1><div ${A(at(r,K(r,'sub','puerto común')))} style="font-size:34px;color:var(--mut)">${s.sub}</div></div>`},
 layers(r){const s=r.s;const keys=K(r,'layers',['blockchain','inteligencia','subapps','operant']);return `<h2 ${A(0.3,'h')}>${s.title}</h2><div style="display:flex;flex-direction:column-reverse;gap:20px">${s.items.map((it,i)=>`<div ${A(at(r,keys[i],i,4),'card')} style="display:flex;align-items:center;gap:34px;padding:28px 40px;margin-left:${i*70}px;border-left:6px solid ${['#00D4AA','#FF6B9D','#FFD700','#7aa2ff'][i]}"><div style="font-size:54px">${it.icon}</div><div><div class="syne" style="font-size:38px;font-weight:700">${it.name}</div><div style="font-size:27px;color:var(--mut);margin-top:6px">${it.desc}</div></div></div>`).join('')}</div>`},
 flow(r){const s=r.s;const keys=K(r,'steps',['uno:','dos:','tres:','cuatro:','y cinco']);return `<h2 ${A(0.3,'h')}>${s.title}</h2><div style="display:flex;gap:26px;align-items:stretch;margin-top:70px">${s.items.map((it,i)=>`<div ${A(at(r,keys[i],i,5),'card')} style="flex:1;padding:36px 28px;position:relative"><div class="mono" style="width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--pink));color:#06080d;font-weight:700;font-size:32px;margin-bottom:26px">${it.n}</div><div class="syne" style="font-size:36px;font-weight:700;margin-bottom:14px">${it.name}</div><div style="font-size:25px;color:var(--mut);line-height:1.35">${it.desc}</div>${i<4?'<div style="position:absolute;right:-24px;top:70px;color:var(--teal);font-size:30px;z-index:2">➜</div>':''}</div>`).join('')}</div>`},
 plans(r){const s=r.s;const keys=K(r,'plans',['starter es','creator pro,','business,','enterprise vip,']);return `<h2 ${A(0.3,'h')} style="margin-bottom:24px;margin-top:-30px">${s.title}</h2><div style="display:flex;gap:24px">${s.items.map((p,i)=>`<div ${A(at(r,keys[i],i,4),'card plan')} data-k="${at(r,keys[i],i,4)}" data-n="${i}" style="flex:1;padding:32px 30px;${i==2?'border-color:#00d4aa88;box-shadow:0 0 60px #00d4aa22':''}"><div class="syne" style="font-size:34px;font-weight:800">${p.name}</div><div style="font-size:21px;color:var(--mut);margin:6px 0 18px">${p.who}</div><div><span class="syne" style="font-size:48px;white-space:nowrap;font-weight:800;color:${['#e9eef5','#00D4AA','#00D4AA','#FFD700'][i]}">${p.price}</span> <span class="mono" style="font-size:20px;color:var(--mut)">${p.per}</span></div><div style="height:1px;background:var(--line);margin:22px 0"></div>${p.pts.map(x=>`<div style="font-size:20px;margin-bottom:10px;display:flex;gap:10px"><span style="color:var(--teal)">✓</span>${x}</div>`).join('')}</div>`).join('')}</div><div ${A(at(r,K(r,'foot','veinte por ciento')),'mono')} style="text-align:center;margin-top:18px;font-size:22px;color:var(--gold)">${s.foot}</div>`},
 matrix(r){const s=r.s;return `<h2 ${A(0.3,'h')}>${s.title}</h2><div ${A(0.6,'card')} style="padding:12px 36px"><table style="width:100%;border-collapse:collapse;font-size:27px">${'<tr>'+s.cols.map((c,j)=>`<th class="syne" style="text-align:${j?'center':'left'};padding:20px 10px;font-size:27px;color:${['','#e9eef5','#00D4AA','#00D4AA','#FFD700'][j]}">${c}</th>`).join('')+'</tr>'}${s.rows.map((row,i)=>`<tr ${A(at(r,null,i+0.5,s.rows.length+0.5))} style="border-top:1px solid var(--line)">${row.map((c,j)=>`<td style="padding:19px 10px;text-align:${j?'center':'left'};color:${j?(c==='—'?'#4a5568':'#e9eef5'):'var(--mut)'};${c==='✓'?'color:var(--teal);font-weight:700':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>`},
 app(r){const s=r.s,u=s.ui;return `<div style="display:flex;gap:70px;height:100%;align-items:center"><div style="width:690px;flex:none"><div ${A(0.2,'kicker')}>${s.label}</div><h2 ${A(0.4,'syne')} style="font-size:68px;white-space:nowrap;font-weight:800;margin-bottom:20px">${s.name}</h2><div ${A(0.7)} style="margin-bottom:40px"><span class="pill gold">${s.plan}</span></div>${bullets(r,s.pts)}${s.tiers?`<div ${A(at(r,K(r,'tiers','en starter')))} style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">${s.tiers.map(t=>`<div class="card" style="padding:12px 16px;border-radius:12px"><div class="mono" style="color:var(--teal);font-size:17px">${t[0]}</div><div style="font-size:19px">${t[1]}</div></div>`).join('')}</div>`:''}${s.aside?`<div ${A(1.2,'aside')}>${s.aside}</div>`:''}</div>
 <div ${A(0.5,'card ui')} style="flex:1;height:600px;position:relative;overflow:hidden;box-shadow:0 40px 120px #000a"><div style="height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px"><i style="width:14px;height:14px;border-radius:50%;background:#ff5f57"></i><i style="width:14px;height:14px;border-radius:50%;background:#febc2e"></i><i style="width:14px;height:14px;border-radius:50%;background:#28c840"></i><div class="mono" style="margin-left:20px;background:#ffffff0d;padding:6px 18px;border-radius:8px;font-size:17px;color:var(--mut)">🔒 ${s.url}</div></div>
 <div style="padding:30px"><div style="display:flex;gap:18px;margin-bottom:26px">${u.kpis.map((k,i)=>`<div ${A(0.9+i*0.2,'card')} style="flex:1;padding:20px;border-radius:14px;background:#0a0f17"><div style="font-size:17px;color:var(--mut)">${k[0]}</div><div class="syne kv" style="font-size:36px;font-weight:700;margin-top:6px">${k[1]}</div></div>`).join('')}</div>
 <div style="display:flex;gap:24px"><div class="card" style="padding:22px;border-radius:14px;background:#0a0f17">${chart(u.chart,r.s.id)}</div><div style="flex:1;display:flex;flex-direction:column;gap:12px">${u.list.map((l,i)=>`<div ${A(2.2+i*0.6,'card')} style="padding:16px 18px;border-radius:12px;background:#0a0f17;display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:600">${l[0]}</span><span class="mono" style="font-size:16px;color:var(--teal)">${l[1]}</span></div>`).join('')}</div></div></div><div class="demo">${L.demo}</div><div class="cursor" style="position:absolute;width:30px;height:30px;left:0;top:0;pointer-events:none"><svg viewBox="0 0 24 24" width="30"><path d="M3 2l7 19 2.5-8.5L21 10z" fill="#fff" stroke="#000" stroke-width="1"/></svg></div></div></div>`},
 chat(r){const s=r.s;let d=LEAD+r.audio*0.18;const parts=s.msgs.map((m,i)=>{const t0=LEAD+0.8+i*(r.audio*0.85/s.msgs.length);return `<div ${A(t0)} style="display:flex;justify-content:${m[0]=='u'?'flex-end':'flex-start'};margin-bottom:22px"><div class="${m[0]=='a'?'type':''}" data-d="${(t0+0.3).toFixed(2)}" data-full="${m[1].replace(/"/g,'&quot;')}" style="max-width:1000px;padding:22px 30px;border-radius:22px;font-size:29px;line-height:1.4;${m[0]=='u'?'background:linear-gradient(135deg,#00d4aa33,#00d4aa1a);border:1px solid #00d4aa55':'background:#121a27;border:1px solid var(--line)'}">${m[0]=='a'?'<span class="mono" style="color:var(--pink);font-size:18px;display:block;margin-bottom:6px">${L.bot}</span><span class="tx"></span>':m[1]}</div></div>`}).join('');return `<h2 ${A(0.3,'h')} style="margin-bottom:30px">${s.title}</h2><div class="card" style="padding:40px 50px;height:560px;position:relative">${parts}</div><div ${A(0.8,'mono')} style="text-align:center;margin-top:24px;font-size:24px;color:var(--teal)">${s.foot}</div>`},
 sector(r){const s=r.s;return `<div ${A(0.2,'kicker')}>${L.sector}</div><div style="display:flex;align-items:baseline;gap:30px;margin-bottom:22px"><h2 ${A(0.4,'syne')} style="font-size:76px;font-weight:800">${s.name}</h2></div><div ${A(0.8)} style="display:flex;gap:14px;margin-bottom:80px">${s.apps.map(a=>`<span class="pill">${a}</span>`).join('')}<span class="pill gold" style="margin-left:auto">${L.rec} · ${s.plan}</span></div><div style="position:relative"><div style="position:absolute;left:60px;right:60px;top:44px;height:4px;background:#ffffff14"><div class="prog" style="height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--pink))"></div></div><div style="display:flex;gap:30px;position:relative">${s.steps.map((st,i)=>`<div ${A(at(r,null,i,4))} style="flex:1;text-align:center"><div class="mono" style="width:92px;height:92px;border-radius:50%;margin:0 auto 30px;display:grid;place-items:center;font-size:34px;font-weight:700;background:#0d121b;border:3px solid var(--teal);color:var(--teal)">${i+1}</div><div class="card" style="padding:28px 24px;font-size:28px;line-height:1.35;min-height:190px">${st}</div></div>`).join('')}</div></div>`},
 role(r){const s=r.s;return `<div style="display:flex;gap:90px;height:100%;align-items:center"><div ${A(0.2)} style="width:520px;flex:none;text-align:center"><div style="width:300px;height:300px;margin:0 auto 36px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#00d4aa55,#0d121b 70%);border:2px solid #00d4aa66" class="syne"><span style="font-size:96px;font-weight:800;padding:20px;line-height:1.05">${s.name.length<=4?s.name:s.name.split(' ').filter(w=>/^[A-ZÁÉÍÓÚ]/.test(w)).map(w=>w[0]).join('').slice(0,3)}</span></div><div class="kicker" style="margin-bottom:10px">${L.role}</div><h2 class="syne" style="font-size:56px;font-weight:800;line-height:1.1">${s.name}</h2></div><div style="flex:1"><div ${A(0.6)} class="syne" style="font-size:52px;font-weight:700;margin-bottom:50px;color:var(--gold)">“${s.q}”</div>${bullets(r,s.pts)}<div ${A(r.audio*0.8)} style="margin-top:30px"><span class="pill gold">${s.kpi[0]} · ${s.kpi[1]}</span></div></div></div>`},
 token(r){const s=r.s;return `<div style="display:flex;gap:90px;height:100%;align-items:center"><div ${A(0.2)} class="coin" style="width:460px;height:460px;flex:none;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#ffd70033,transparent 70%)"><div class="spin">${LOGO(360)}</div></div><div style="flex:1"><h2 ${A(0.4,'h')}>${s.title.replace(K(r,'accent','combustible'),`<em>${K(r,'accent','combustible')}</em>`)}</h2>${bullets(r,s.pts)}<div ${A(1.4,'mono')} style="font-size:22px;color:var(--teal);margin-top:24px">${s.addr}</div><div ${A(1.6,'aside')}>${s.aside}</div></div></div>`},
 cta(r){const s=r.s;return `<div style="height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><div ${A(0.2)} style="margin-bottom:40px">${LOGO(150)}</div><h1 ${A(at(r,K(r,'title','empieza hoy')),'h')} style="font-size:110px"><em>${s.title}</em></h1><div ${A(at(r,K(r,'title','empieza hoy'))+0.5)} style="font-size:36px;color:var(--mut);margin-bottom:60px">${s.sub}</div><div style="display:flex;gap:26px">${s.links.map((l,i)=>`<div ${A(at(r,K(r,'links','conecta tu'))+i*0.7,'card mono')} style="padding:22px 38px;font-size:30px;color:${i?'var(--txt)':'var(--teal)'}">${l}</div>`).join('')}</div></div>`},
};
function build(i){const r=TL[i];document.getElementById('scene').innerHTML=B[r.s.type](r);document.getElementById('chap').textContent=r.s.chapter;built=i;
 // frases del subtítulo con su momento
 const sent=r.s.say.match(/[^.?!:]+[.?!:]*/g).map(x=>x.trim()).filter(Boolean);const tot=sent.reduce((a,b)=>a+b.length,0);let acc=0;r.caps=sent.map(x=>{const c={t:LEAD+acc/tot*r.audio,x:x.replace(/ (punto|dot) /g,'.')};acc+=x.length;return c});}
function render(T){let i=TL.findIndex(r=>T>=r.start&&T<r.start+r.len);if(i<0)i=TL.length-1;const r=TL[i],t=T-r.start;if(built!==i)build(i);
 const sc=document.getElementById('scene');const fade=Math.min(ease(t/0.45),ease((r.len-t)/0.45));sc.style.opacity=fade;sc.style.transform=`scale(${0.985+0.015*fade})`;
 document.querySelectorAll('#scene .in').forEach(e=>{const p=ease((t-+e.dataset.d)/0.6);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*36}px)`});
 document.querySelectorAll('#scene .gb').forEach(e=>{const p=ease((t-+e.dataset.d)/0.8);const h=+e.dataset.h*p;e.setAttribute('height',h);e.setAttribute('y',170-h)});
 document.querySelectorAll('#scene .type').forEach(e=>{const f=e.dataset.full;const n=Math.floor(cl((t-+e.dataset.d)/(f.length/38))*f.length);e.querySelector('.tx').textContent=f.slice(0,n)+(n<f.length&&n>0?'▍':'')});
 const pg=document.querySelector('#scene .prog');if(pg)pg.style.width=(cl((t-LEAD)/(r.audio*0.85))*100)+'%';
 const sp=document.querySelector('#scene .spin');if(sp)sp.style.transform=`rotateY(${(t*40)%360}deg)`;
 const bl=document.getElementById('biglogo');if(bl)bl.style.transform=`rotate(${t*12}deg)`;
 const cur=document.querySelector('#scene .cursor');if(cur){const k=t*0.35;cur.style.transform=`translate(${520+330*Math.sin(k)}px,${360+180*Math.sin(k*1.7)}px)`;cur.style.opacity=ease((t-1.5)/0.5)}
 document.querySelectorAll('#scene .plan').forEach(e=>{const n=+e.dataset.n,k=+e.dataset.k;const nx=document.querySelector(`#scene .plan[data-n="${n+1}"]`);const end=nx?+nx.dataset.k:r.len;const on=t>=k&&t<end;e.style.borderColor=on?'#00D4AA':'';e.style.transform+=on?' scale(1.03)':''});
 let c='';for(const x of r.caps)if(t>=x.t-0.05)c=x.x;const cp=document.getElementById('cap');cp.textContent=c;cp.style.opacity=c&&t<r.audio+LEAD+0.3?1:0;
 document.getElementById('barin').style.width=(T/TOTAL*100)+'%';
 const g=T*8;document.getElementById('grid').style.transform=`translate(${-(g%80)}px,${-(g%80)}px)`;
 o1.style.left=(-200+300*Math.sin(T*0.07))+'px';o1.style.top=(-300+200*Math.cos(T*0.05))+'px';o2.style.left=(1300+250*Math.cos(T*0.06))+'px';o2.style.top=(400+200*Math.sin(T*0.08))+'px';o3.style.left=(700+300*Math.sin(T*0.04))+'px';o3.style.top=(700+100*Math.cos(T*0.09))+'px';
}
window.setup=setup;window.render=render;
</script>
</body>
</html>
