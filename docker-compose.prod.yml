# ─────────────────────────────────────────────────────
#  BeZhas Production Compose
#  Extiende docker-compose.yml con:
#    - Nginx de borde (TLS)
#    - Límites de recursos
#    - Políticas de reinicio
#    - Rotación de logs
#    - Sin puertos internos publicados
#
#  Uso:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#    docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
#  ── Por qué cambió este fichero ─────────────────────────────────────────
#
#  Estaba ROTO: el par base+prod ni siquiera producía un proyecto válido.
#
#      service "bezhas-batcher" has neither an image nor a build context
#      specified: invalid compose project
#
#  La causa: sobreescribía ocho servicios que no existen en el base. Compose
#  no distingue entre "ajustar un servicio" y "declarar uno nuevo" — un
#  override huérfano se convierte en un servicio sin imagen, y todo el
#  proyecto deja de parsear. Como `scripts/deploy-prod.sh` invoca justo ese
#  par, el despliegue de producción abortaba en el primer comando.
#
#  Concretamente: el base define `bezhas-api`, no `api`; y `ai-gateway`,
#  `control-center`, `bezhas-node` y `bezhas-batcher` no estaban definidos en
#  ningún compose del repositorio, solo aquí. Ver el bloque comentado del
#  final: se conserva la intención en vez de borrarla.
# ─────────────────────────────────────────────────────

services:

  # ── Nginx (borde público) ──────────────────────────
  nginx:
    build: ./nginx
    container_name: bezhas-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # Antes esperaba a `api` y `control-center`. El primero se llama
    # `bezhas-api` en el base; el segundo no existe como servicio, así que
    # esperarlo dejaba nginx bloqueado para siempre.
    depends_on:
      bezhas-api:
        condition: service_healthy
    networks:
      - bezhas-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ajustes sobre los servicios del base ───────────

  postgres:
    ports: !override []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !override []
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bezhas-api:
    ports: !override []
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── OPERANT (plano de operación de empresa) ────────
  #
  # Su Postgres es SEPARADO del de la plataforma a propósito: OPERANT aplica
  # RLS y se conecta con el rol `operant_app` (sin BYPASSRLS). Meterlo en la
  # misma instancia que la API mezclaría dos modelos de aislamiento distintos.
  operant-postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  business-ops:
    ports: !override []
    restart: always
    environment:
      NODE_ENV: production
    # Margen mayor que el resto: aquí viven los 10 departamentos y sus
    # especialistas, y el embedding de memoria vectorial es lo que más come.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── MCPs internos ──────────────────────────────────
  messaging-mcp:
    ports: !override []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  obsidian-mcp:
    ports: !override []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bezhas-core-mcp:
    ports: !override []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ── Servicios que este fichero esperaba y que NO existen ──────────────────
#
# Se conservan comentados en vez de borrarse: describen una topología de
# producción que se quiso tener, y perderla sería peor que tenerla inerte.
# Para reactivar cualquiera de ellos hace falta ANTES definirlo en
# docker-compose.yml con su `build` o `image`; solo entonces el bloque de
# aquí pasa a ser un ajuste válido.
#
# Estado de cada uno, comprobado en el repositorio:
#
#   aegis            → aegis/ existe y tiene Dockerfile. Falta el servicio en
#                      el base. Es el candidato más cercano a poder volver.
#   control-center   → control-center/ existe y tiene Dockerfile. Igual.
#   bezhas-geth      → definido en enterprise-node/docker-compose.yml, que es
#                      un proyecto de compose aparte, no este base.
#   ai-gateway       → el directorio ai-gateway/ NO existe. Nunca se construyó.
#   bezhas-node      → sin definición en ningún compose del repositorio.
#   bezhas-batcher   → sin definición en ningún compose del repositorio.
#   bezhas-edge-node → definido en docker-compose.dev.yml, no en el base.
#
#   aegis:
#     ports: !override []
#     restart: always
#     deploy: { resources: { limits: { cpus: "1", memory: 1G } } }
#
#   control-center:
#     ports: !override []
#     restart: always
#     environment:
#       - NODE_ENV=production
#       - NEXT_PUBLIC_API_URL=/api
#       - NEXT_PUBLIC_RPC_URL=http://bezhas-geth:8545
#     deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
#
#   bezhas-geth:
#     ports: !override []
#     restart: always
#     deploy: { resources: { limits: { cpus: "2", memory: 4G } } }
#
#   bezhas-node:
#     restart: always
#     deploy: { resources: { limits: { cpus: "1", memory: 2G } } }
#
#   bezhas-batcher:
#     restart: always
#     deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
#
#   ai-gateway:
#     ports: !override []
#     restart: always
#     deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }
#
#   bezhas-edge-node:
#     ports: !override []
#     restart: always
#     deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
