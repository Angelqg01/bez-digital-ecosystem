<div class="fixed inset-0 z-0">
<div class="absolute inset-0 circuit-lines opacity-40"></div>
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container/10 rounded-full blur-[120px]"></div>

<path d="M0 100 Q 250 100 250 350 T 500 600 T 1000 600" fill="none" stroke="#00e5ff" stroke-width="0.5"></path>
<path d="M1200 0 Q 1000 300 800 300 T 500 700" fill="none" stroke="#00e5ff" stroke-width="0.5"></path>
</svg>

<!-- Main Splash Canvas -->
<main class="relative z-10 w-full max-w-lg px-6 flex flex-col items-center">

<div class="mb-12 flex flex-col items-center space-y-2">
<div class="flex items-center space-x-2 text-primary opacity-80">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
<span class="font-headline tracking-widest text-[10px] uppercase">Nexus Protocol Secure Access</span>
</div>
</div>
<!-- Central Identity Core -->
<div class="relative group cursor-pointer">
<!-- Glow Effect Layers -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-2xl transition-all group-hover:bg-primary-container/40"></div>
<!-- Main Login Button -->
<button class="relative w-64 h-64 glass-panel rounded-full border border-primary/20 flex flex-col items-center justify-center space-y-4 shadow-2xl transition-transform active:scale-95 group-hover:border-primary/50">
<!-- Abstract ID Icon -->
<div class="relative w-24 h-24 flex items-center justify-center">
<div class="absolute inset-0 border-2 border-primary/30 rounded-full animate-ping opacity-20"></div>
<div class="absolute inset-2 border border-primary/40 rounded-full"></div>
<span class="material-symbols-outlined text-6xl text-primary" data-icon="fingerprint">fingerprint</span>
</div>
<div class="text-center">
<span class="block font-headline font-bold text-2xl tracking-tight text-white drop-shadow-[0_0_8px_rgba(0,229,255,0.4)]">BeZhas ID</span>
<span class="text-[10px] text-primary/60 font-medium uppercase tracking-[0.2em] mt-1 block">Initialize Node</span>
</div>
</button>
<!-- Decorative Orbitals -->
<div class="absolute -top-4 -right-4 w-12 h-12 glass-panel rounded-xl border border-primary/10 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary/40 text-lg" data-icon="lan">lan</span>
</div>
<div class="absolute -bottom-2 -left-6 w-10 h-10 glass-panel rounded-lg border border-primary/10 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary/40 text-md" data-icon="security">security</span>
</div>
</div>
<!-- Status Message -->
<div class="mt-16 text-center space-y-4">
<div class="flex items-center justify-center space-x-3">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse shadow-[0_0_8px_#00e5ff]"></div>
<p class="text-on-surface-variant font-body text-sm tracking-wide">
                    Authenticating with On-Chain Reputation...
                </p>
</div>
<!-- Reputation Progress Bar -->
<div class="w-48 h-1 bg-surface-container-high rounded-full mx-auto overflow-hidden">
<div class="h-full bg-primary-container w-2/3 shadow-[0_0_10px_rgba(0,229,255,0.5)]"></div>
</div>
</div>
<!-- Alternative Connection -->
<div class="mt-20 w-full flex flex-col items-center space-y-6">
<div class="flex items-center w-full max-w-xs">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="px-4 text-[10px] text-outline uppercase tracking-widest font-medium">Or</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<button class="flex items-center space-x-3 px-8 py-3 rounded-xl border border-outline-variant/20 hover:border-primary/40 transition-all hover:bg-surface-container-high active:scale-95">
<span class="material-symbols-outlined text-primary" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label text-sm text-on-surface-variant">Connect Wallet</span>
</button>
</div>
</main>

<div class="fixed bottom-8 left-8 hidden lg:block opacity-20">
<div class="font-headline text-xs space-y-1 text-primary">
<p>NETWORK_STATUS: ENCRYPTED</p>
