<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guardian Verification Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25aff4",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-background-light dark:bg-background-dark overflow-x-hidden shadow-2xl border-x border-primary/10">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Verification</h2>
</div>
<!-- Success Visual Container -->
<div class="@container flex-1 flex flex-col justify-center items-center px-6">
<div class="relative w-full aspect-square flex items-center justify-center">
<!-- Decorative Background Glow -->
<div class="absolute inset-0 bg-primary/10 rounded-full blur-3xl"></div>
<!-- Main Success Graphic -->
<div class="relative flex flex-col items-center justify-center w-64 h-64 rounded-full border-2 border-primary/20 bg-primary/5">
<!-- Rotating or Layered Effect Simulation -->
<div class="absolute inset-4 rounded-full border border-primary/30 border-dashed"></div>
<div class="absolute inset-8 rounded-full border-2 border-primary/10"></div>
<!-- Center Icon -->
<div class="z-10 bg-primary text-background-dark p-6 rounded-full shadow-[0_0_40px_rgba(37,175,244,0.4)]">
<span class="material-symbols-outlined text-7xl font-bold">verified_user</span>
</div>
<!-- Biometric Scanning Lines simulation -->
<div class="absolute bottom-1/4 w-32 h-0.5 bg-primary/40 blur-sm"></div>
</div>
</div>
<!-- Content Section -->
<div class="text-center mt-10 space-y-4">
<h2 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-bold leading-tight">
                    Quorum Reached: Identity Verified
                </h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed max-w-xs mx-auto">
                    The required number of guardians have approved your request. Your identity has been cryptographically confirmed via biometric consensus.
                </p>
</div>
<!-- Status Indicator -->
<div class="mt-8 flex items-center gap-2 px-4 py-2 bg-primary/10 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-primary text-sm">check_circle</span>
<span class="text-xs font-bold uppercase tracking-widest text-primary">3/3 Guardians Confirmed</span>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="p-6 mt-auto">
<button class="w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 bg-primary text-background-dark text-lg font-bold leading-normal tracking-wide shadow-lg shadow-primary/20 active:scale-95 transition-transform flex gap-3">
<span class="truncate">Continue to Restoration</span>
<span class="material-symbols-outlined">chevron_right</span>
</button>
<p class="text-center text-xs text-slate-500 mt-4 font-medium opacity-60">
                Secure Session ID: 882-QX-901
            </p>
</div>
<!-- Decorative UI Element (Footer spacing) -->
<div class="h-2 bg-primary/10 w-1/3 mx-auto rounded-full mb-4 opacity-20"></div>
</div>
</body></html>
