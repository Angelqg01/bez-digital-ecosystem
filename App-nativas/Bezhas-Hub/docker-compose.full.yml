version: '3.8'

# ============================================
# BeZhas Web3 - Production Docker Compose
# ============================================
# 
# Usage:
#   docker-compose -f docker-compose.production.yml up -d
#
# Environment:
#   Copy .env.production.example to .env.production and fill in values
#
# ============================================

services:
  # ============================================
  # Backend API Server
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: bezhas-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bezhas-internal
      - bezhas-external

  # ============================================
  # PostgreSQL (base de datos principal)
  # ============================================
  # Este servicio estaba fusionado dentro de `backend`: faltaba su clave
  # `postgres:` y el cuerpo quedó absorbido, duplicando `restart` y dejando el
  # fichero como YAML inválido — `docker compose` no podía ni parsearlo, así que
  # no había forma de levantar la BD.
  #
  # De paso se quitan los restos de la etapa MongoDB, que apuntaban a un motor
  # que ya no es este: healthcheck con `mongosh`, `--wiredTigerCacheSizeGB`,
  # el volumen `/data/configdb` y el init de `./docker/mongo/init`.
  postgres:
    image: postgres:16
    container_name: bezhas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bezhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bezhas_password}
      POSTGRES_DB: ${POSTGRES_DB:-bezhas}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bezhas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bezhas} -d ${POSTGRES_DB:-bezhas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================================
  # Frontend (SPA React + Vite)
  # ============================================
  # Faltaba en este fichero pese a que `nginx` lo declaraba en depends_on, lo
  # que hacía inválido el perfil `with-nginx`. Se define igual que en
  # docker-compose.gcp.yml: Dockerfile.optimized es el único que acepta los
  # args VITE_* (el Dockerfile a secas no acepta ninguno).
  #
  # La imagen resultante YA es un nginx sirviendo el build en el puerto 80 con
  # el fallback de React Router; el nginx de abajo sólo hace de proxy delante.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.optimized
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
        - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:3001}
        - VITE_CHAIN_ID=${VITE_CHAIN_ID:-137}
        - VITE_NETWORK=${VITE_NETWORK:-polygon}
    container_name: bezhas-frontend
    restart: always
    # 8081 y no 80: con el perfil `with-nginx` activo, el proxy ocupa el 80 del
    # host. Publicarlo aquí permite además abrir el frontend sin levantar nginx.
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - bezhas-external
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: bezhas-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - bezhas-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================
  # TimescaleDB (Analytics)
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: bezhas-timescale
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bezhas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bezhas_analytics
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - bezhas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bezhas -d bezhas_analytics"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ============================================
  # AEGIS Security Service
  # ============================================
  aegis:
    build:
      context: ./aegis
      dockerfile: Dockerfile
    container_name: bezhas-aegis
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      # `?authSource=admin` es un parámetro de MongoDB: libpq rechaza la
      # conexión con «invalid URI query parameter». Otro resto de la etapa Mongo.
      - DATABASE_URL=postgresql://bezhas:bezhas_password@postgres:5432/bezhas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AEGIS_PORT=8001
      - AEGIS_HOST=0.0.0.0
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bezhas-internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================
  # Nginx Reverse Proxy (Optional - for custom SSL)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: bezhas-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - bezhas-external
    profiles:
      - with-nginx

  # ============================================
  # Monitoring: Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: bezhas-prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - bezhas-internal
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    profiles:
      - monitoring

  # ============================================
  # Monitoring: Grafana
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: bezhas-grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - bezhas-internal
    profiles:
      - monitoring

# ============================================
# Networks
# ============================================
networks:
  bezhas-internal:
    driver: bridge
    internal: true
  bezhas-external:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  mongo-config:
    driver: local
  redis-data:
    driver: local
  timescale-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
