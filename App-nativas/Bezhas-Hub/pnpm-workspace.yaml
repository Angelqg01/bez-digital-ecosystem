
packages:
  - 'backend'
  - 'frontend'
  - 'sdk'
  - 'packages/*'
allowBuilds:
  '@arbitrum/nitro-contracts': true
  '@prisma/engines': true
  '@reown/appkit': true
  '@scarf/scarf': false
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  secp256k1: true
# @scarf/scarf ya está decidido (false) arriba: que sea aviso, no error de install.
strictDepBuilds: false
# @chainlink/contracts trae una subdep git (@zksync/contracts) que pnpm 11 bloquea por defecto
blockExoticSubdeps: false

# Fuerza versiones parcheadas de deps transitivas con CVEs (pnpm audit --prod).
# Rangos ">=X" = mínimo seguro; pnpm resuelve a la última compatible.
overrides:
  '@hono/node-server': '>=2.1.3'
  '@openzeppelin/contracts-upgradeable': '>=4.8.3'
  axios: '>=1.18.0'
  defu: '>=6.1.5'
  effect: '>=3.20.0'
  express-rate-limit: '>=8.2.2'
  fast-uri: '>=4.2.3'
  form-data: '>=4.0.6'
  # Línea 1: unstorage espera h3 1.x; el rango abierto arrastraba 2.0.0-rc vulnerables.
  h3: '^1.15.6'
  hono: '^4.13.11'
  lodash: '>=4.17.24'
  # Por rama: un override global forzaba la 10.x a quien pedía la 3 (API distinta).
  'minimatch@3': '^3.1.3'
  'minimatch@5': '^5.1.8'
  'minimatch@9': '^11.0.1'
  mongoose: '^8.24.1'
  multer: '>=2.5.0'
  nodemailer: '>=10.1.4'
  # OJO: un override sin selector reemplaza el rango del dependiente por completo
  # (">=0.1.10" resolvía a 8.x y rompía express, cuyo router usa la API 0.1.x).
  # El selector "@<0.2" limita el parche del CVE ReDoS a la línea 0.1.
  'path-to-regexp@<0.2': '>=0.1.12 <0.2'
  'picomatch@2': '^2.3.2'
  tmp: '>=0.2.6'
  underscore: '>=1.13.8'
  ws: '>=8.21.0'
  # Auditoría 2026-09-19 (pnpm audit --prod): parches acotados por rama.
  '@openzeppelin/contracts@>=4.3.0 <4.8.3': '^4.9.6'
  browserslist: '>=4.28.7'
  ip-address: '^10.7.4'
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  mysql2: '>=3.22.0'
  'nanoid@<4': '^3.3.18'
  'nanoid@>=4': '>=5.1.16'
  'picomatch@4': '^4.0.4'
  'minimatch@10': '^11.0.1'
  # Herramientas de desarrollo y build (misma rama mayor, sin saltos de API).
  'brace-expansion@1': '^1.1.12'
  'brace-expansion@2': '^2.1.4'
  'rollup@4': '^4.59.0'
  flatted: '^3.4.2'
  'undici@6': '^6.27.0'
  handlebars: '^4.7.10'
  '@babel/plugin-transform-modules-systemjs': '^7.29.4'
  shell-quote: '^1.11.0'
  'postcss@8': '^8.5.18'
  'immutable@4': '^4.3.9'
  'vitest@3': '^3.2.6'
  '@grpc/grpc-js@1': '^1.14.5'
  '@hono/node-server@2': '^2.1.3'
  '@modelcontextprotocol/sdk@1': '^1.32.0'
  '@openzeppelin/contracts@4': '^4.9.6'
  '@remix-run/router@1': '^1.23.3'
  adm-zip@0: '^0.6.1'
  ajv@6: '^6.14.0'
  ajv@8: '^8.18.0'
  bn.js@4: '^4.12.3'
  bn.js@5: '^5.2.3'
  compression@1: '^1.8.2'
  fast-copy@3: '^3.1.0'
  fflate@0: '^0.6.11'
  follow-redirects@1: '^1.16.2'
  pbkdf2@3: '^3.1.7'
  proxy-addr@2: '^2.0.8'
  qs@6: '^6.16.0'
  react-router@6: '^6.30.4'
  react-router-dom@6: '^6.30.6'
  rollup@2: '^2.80.0'
  source-map-js@1: '^1.2.2'
  uuid@11: '^11.1.1'
  valibot@1: '^1.4.2'
  yaml@1: '^1.10.3'
  # Auditoría 2026-11-10 (pnpm audit --prod): parches dentro de la misma rama mayor.
  'body-parser@1': '^1.20.9'
  'body-parser@2': '^2.4.0'
  '@simplewebauthn/server@13': '^13.3.2'
  # elliptic: el aviso (bajo) pide >=6.6.2, que no está publicada; la última es 6.6.1.
  # uuid: el aviso cubre todo <11.1.1 y aquí llegan la 8 (node-cron) y la 9
  # (natural y el propio backend). Igual que en api/: sólo se sube la rama vulnerable.
  'uuid@<11.1.1': '^11.1.1'
  # --- Saltos de versión mayor (2026-11-10), pedidos de forma explícita -----------
  # zod <4.6.6 (alto). El backend y packages/mcp-server ya declaran la 4; esto
  # arrastra a quien fija la 3: @reown/appkit-wallet (3.22.4 exacta) y los peers
  # de abitype y @anthropic-ai/sdk, que admiten ^4. appkit-wallet sólo usa
  # object/string/literal/array/record(k, v)/extend, iguales en la 4.
  'zod@3': '^4.6.6'
  # glob >=9 <=14.0.1 y minimatch >=7 <11.0.1 (moderados). La 10 llega por rimraf.
  'glob@10': '^14.0.2'
  'glob@13': '^14.0.2'
  # @web3modal/wagmi@5.1.11 (deprecado) fija WalletConnect 2.16.1, que trae
  # query-string > decode-uri-component 0.2.2 (alto) y @stablelib/ed25519 1.x.
  # La 2.21.10 ya está en el árbol por @reown/appkit y no usa ninguno de los dos.
  '@walletconnect/core@2.16.1': '2.21.10'
  '@walletconnect/sign-client@2.16.1': '2.21.10'
  '@walletconnect/types@2.16.1': '2.21.10'
  '@walletconnect/utils@2.16.1': '2.21.10'
  '@walletconnect/universal-provider@2.16.1': '2.21.10'
  '@walletconnect/ethereum-provider@2.16.1': '2.21.10'
  # @reown/appkit@1.8.1 fija la 2.21.7, la última que aún usa query-string.
  '@walletconnect/core@2.21.7': '2.21.10'
  '@walletconnect/sign-client@2.21.7': '2.21.10'
  '@walletconnect/types@2.21.7': '2.21.10'
  '@walletconnect/utils@2.21.7': '2.21.10'
  '@walletconnect/universal-provider@2.21.7': '2.21.10'
