
packages:
  - 'backend'
  - 'frontend'
  - 'sdk'
  - 'packages/*'
allowBuilds:
  '@arbitrum/nitro-contracts': true
  '@prisma/engines': true
  '@reown/appkit': true
  '@scarf/scarf': false
  esbuild: true
  keccak: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  secp256k1: true
# @scarf/scarf ya está decidido (false) arriba: que sea aviso, no error de install.
strictDepBuilds: false
# @chainlink/contracts trae una subdep git (@zksync/contracts) que pnpm 11 bloquea por defecto
blockExoticSubdeps: false

# Fuerza versiones parcheadas de deps transitivas con CVEs (pnpm audit --prod).
# Rangos ">=X" = mínimo seguro; pnpm resuelve a la última compatible.
overrides:
  '@hono/node-server': '>=1.19.10'
  '@openzeppelin/contracts-upgradeable': '>=4.8.3'
  axios: '>=1.18.0'
  defu: '>=6.1.5'
  effect: '>=3.20.0'
  express-rate-limit: '>=8.2.2'
  fast-uri: '>=4.1.3'
  form-data: '>=4.0.6'
  # Línea 1: unstorage espera h3 1.x; el rango abierto arrastraba 2.0.0-rc vulnerables.
  h3: '^1.15.6'
  hono: '>=4.12.4'
  lodash: '>=4.17.24'
  # Por rama: un override global forzaba la 10.x a quien pedía la 3 (API distinta).
  'minimatch@3': '^3.1.3'
  'minimatch@5': '^5.1.8'
  'minimatch@9': '^9.0.7'
  mongoose: '>=8.22.1'
  multer: '>=2.3.0'
  nodemailer: '>=9.1.0'
  # OJO: un override sin selector reemplaza el rango del dependiente por completo
  # (">=0.1.10" resolvía a 8.x y rompía express, cuyo router usa la API 0.1.x).
  # El selector "@<0.2" limita el parche del CVE ReDoS a la línea 0.1.
  'path-to-regexp@<0.2': '>=0.1.12 <0.2'
  'picomatch@2': '^2.3.2'
  tmp: '>=0.2.6'
  underscore: '>=1.13.8'
  ws: '>=8.21.0'
  # Auditoría 2026-09-19 (pnpm audit --prod): parches acotados por rama.
  '@openzeppelin/contracts@>=4.3.0 <4.8.3': '^4.9.6'
  browserslist: '>=4.28.7'
  ip-address: '>=10.3.1'
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  mysql2: '>=3.22.0'
  'nanoid@<4': '^3.3.18'
  'nanoid@>=4': '>=5.1.16'
  'picomatch@4': '^4.0.4'
  'minimatch@10': '^10.2.3'
  '@chainlink/contracts>@openzeppelin/contracts': '^4.9.6'
  # Herramientas de desarrollo y build (misma rama mayor, sin saltos de API).
  'brace-expansion@1': '^1.1.12'
  'brace-expansion@2': '^2.1.4'
  'rollup@4': '^4.59.0'
  flatted: '^3.4.2'
  'undici@6': '^6.27.0'
  handlebars: '^4.7.9'
  '@babel/plugin-transform-modules-systemjs': '^7.29.4'
  shell-quote: '^1.8.5'
  'postcss@8': '^8.5.18'
  'immutable@4': '^4.3.9'
  'vitest@3': '^3.2.6'
