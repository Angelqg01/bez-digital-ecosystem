packages:
  - '.'
allowBuilds:
  '@reown/appkit': true
  unrs-resolver: true
# Parches de seguridad (2026-10-23): versiones mínimas de dependencias
# transitivas con CVE. Cada rama mayor lleva su propio ^, nunca >=: un >= suelto
# sube brace-expansion@1 o nanoid@3 a la v5/v6, que cambian de API (ESM puro o
# sin export por defecto) y rompen a los consumidores que los cargan con require().
overrides:
  axios: '^1.20.0'
  brace-expansion@1: '^1.1.21'
  brace-expansion@2: '^2.1.7'
  brace-expansion@5: '^5.0.12'
  browserslist: '^4.28.7'
  follow-redirects: '^1.16.1'
  form-data@4: '^4.0.6'
  glob@10: '^10.5.0'
  js-yaml@4: '^4.3.2'
  nanoid@3: '^3.3.18'
  postcss: '^8.5.18'
  sharp: '^0.35.5'
  source-map-js: '^1.2.2'
  ws@7: '^7.5.11'
  ws@8: '^8.21.0'
