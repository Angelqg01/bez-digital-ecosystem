[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# OpenZeppelin sale de node_modules (pnpm install), no de una copia vendida en lib/ (eran 878 ficheros).
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
polygon = "${POLYGON_RPC_URL}"
amoy = "${AMOY_RPC_URL}"
