name: Secrets Scan

on:
  push:
    branches: [main, develop, feat/*, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Secrets Scanner
        working-directory: App-nativas/Bezhas-Hub
        run: node scripts/scan-secrets.js
