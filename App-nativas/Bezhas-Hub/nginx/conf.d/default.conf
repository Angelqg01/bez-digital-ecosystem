# ============================================================================
# BeZhas Hub — enrutado del proxy inverso
# ============================================================================
#   /        → frontend (SPA de Vite, servida por el nginx de su propia imagen)
#   /api/    → backend:3001
#   /ws      → backend:3001 (WebSocket, ver websocket-hub.service.js)
#
# Los nombres `frontend` y `backend` los resuelve el DNS interno de Docker
# Compose; ambos servicios están en la red bezhas-external, que es donde vive
# este nginx.

upstream bezhas_frontend {
    server frontend:80;
    keepalive 16;
}

upstream bezhas_backend {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Cabeceras de seguridad. HSTS se deja fuera a propósito: sólo tiene
    # sentido sirviendo por HTTPS, y activarlo en HTTP deja al navegador
    # recordando una redirección que aún no existe.
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Salud del propio proxy — no toca a los upstreams.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://bezhas_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Sin buffering: el Hub emite respuestas en streaming (chat IA).
        proxy_buffering off;
    }

    # ── WebSocket ───────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://bezhas_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Una conexión de WebSocket está inactiva largos ratos: con el
        # read_timeout por defecto (60s) nginx la cortaría constantemente.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── SPA ─────────────────────────────────────────────────────────────────
    # La imagen del frontend ya resuelve el fallback de React Router con
    # try_files; aquí sólo se le pasa la petición.
    location / {
        proxy_pass http://bezhas_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}

