# ============================================================================
# BeZhas Hub — nginx (proxy inverso del stack)
# ============================================================================
# Config principal. docker-compose.full.yml monta este fichero sobre
# /etc/nginx/nginx.conf, sustituyendo al de la imagen: por eso tiene que ser
# un config COMPLETO (events + http) y no sólo un server block.
#
# Los server blocks van en conf.d/, que se incluye al final.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Subidas: el Hub acepta documentos e imágenes (IPFS, PureScan).
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Necesario para WebSocket: traduce la cabecera Upgrade del cliente en el
    # valor correcto de Connection hacia el backend. Sin esto, el handshake de
    # /ws se cae con un 400.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
