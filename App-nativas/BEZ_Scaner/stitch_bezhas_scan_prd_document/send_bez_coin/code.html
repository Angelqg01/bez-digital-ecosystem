<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#160d08",
                        "surface-dark": "#221610",
                        "accent-orange": "#ff7a3d",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .glow-subtle { box-shadow: 0 0 20px rgba(236, 91, 19, 0.15); }
        .num-pad-btn:active { background-color: rgba(236, 91, 19, 0.2); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<div class="relative flex h-[844px] w-full max-w-[390px] flex-col bg-background-light dark:bg-background-dark overflow-hidden border-x border-slate-200 dark:border-slate-800 shadow-2xl">
<!-- Top Navigation -->
<div class="flex items-center p-4 justify-between">
<div class="flex size-10 items-center justify-center rounded-full hover:bg-primary/10 cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">Send BEZ-Coin</h2>
<div class="flex size-10 items-center justify-center rounded-full hover:bg-primary/10 cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">info</span>
</div>
</div>
<!-- Balance Card -->
<div class="px-4 py-2">
<div class="flex flex-col gap-1 rounded-2xl p-5 bg-primary/10 border border-primary/20 glow-subtle">
<p class="text-primary text-xs font-bold uppercase tracking-widest">Available Balance</p>
<div class="flex items-baseline gap-2">
<p class="text-slate-900 dark:text-white text-2xl font-extrabold tracking-tight">1,250.45</p>
<p class="text-primary text-sm font-bold">BEZ</p>
</div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">BeZhas Mainnet</p>
</div>
</div>
<!-- Recipient Input -->
<div class="px-4 py-4">
<label class="flex flex-col gap-2">
<p class="text-slate-700 dark:text-slate-300 text-sm font-semibold px-1">Recipient Address</p>
<div class="flex items-stretch group">
<input class="flex-1 rounded-l-xl text-slate-900 dark:text-white border border-slate-200 dark:border-slate-700 bg-white dark:bg-surface-dark focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 text-sm font-medium transition-colors outline-none placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Enter BEZ address or ENS" value=""/>
<button class="flex items-center justify-center px-4 bg-primary text-white rounded-r-xl hover:bg-accent-orange transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
</button>
</div>
</label>
</div>
<!-- Amount Display -->
<div class="flex flex-col items-center justify-center flex-1 py-4">
<div class="flex items-baseline gap-2 mb-1">
<h1 class="text-primary tracking-tighter text-6xl font-black">250</h1>
<span class="text-slate-400 text-2xl font-bold uppercase">BEZ</span>
</div>
<div class="flex items-center gap-1 px-4 py-1.5 rounded-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
<span class="material-symbols-outlined text-sm text-green-500">sync</span>
<p class="text-slate-600 dark:text-slate-300 text-sm font-bold">≈ $3,412.50 USD</p>
</div>
</div>
<!-- Custom Numeric Keypad -->
<div class="grid grid-cols-3 gap-px bg-slate-200 dark:bg-slate-800/50 mt-auto">
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">1</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">2</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">3</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">4</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">5</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">6</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">7</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">8</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">9</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">.</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-2xl font-bold text-slate-800 dark:text-slate-100">0</button>
<button class="num-pad-btn h-16 flex items-center justify-center bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Action Button -->
<div class="p-6 bg-background-light dark:bg-background-dark">
<button class="w-full h-16 bg-primary hover:bg-accent-orange text-white font-bold text-lg rounded-2xl shadow-lg shadow-primary/30 flex items-center justify-center gap-3 transition-all transform active:scale-[0.98]">
                Review Transaction
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Home Indicator (Mobile feel) -->
<div class="flex justify-center pb-2 bg-background-light dark:bg-background-dark">
<div class="h-1.5 w-32 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</div>
</body></html>
