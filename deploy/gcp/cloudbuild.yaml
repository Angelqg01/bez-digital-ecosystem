# ============================================================================
# BeZhas — Cloud Build: construir y desplegar en Cloud Run (www.bezhas.com)
# ============================================================================
# Se lanza desde la RAÍZ del repositorio con deploy/gcp/deploy.sh, o a mano:
#
#   gcloud builds submit . --config=deploy/gcp/cloudbuild.yaml \
#     --project=project-a2f60001-ecbb-49af-8c2 \
#     --service-account=projects/project-a2f60001-ecbb-49af-8c2/serviceAccounts/bezhas-deployer@project-a2f60001-ecbb-49af-8c2.iam.gserviceaccount.com \
#     --substitutions=_TAG=$(git rev-parse --short HEAD)
#
# Decisiones de seguridad:
#   - Cada servicio corre con SU cuenta de servicio (01-bootstrap.sh), no con
#     la cuenta por defecto de Compute, que tiene rol de editor del proyecto.
#   - Ingress `internal-and-cloud-load-balancing`: solo se entra por el
#     balanceador (y su Cloud Armor). Las URLs *.run.app dejan de responder
#     desde Internet, así que nadie puede saltarse el WAF por ahí.
#   - Solo se montan los secretos que tienen versión en Secret Manager; los
#     valores nunca pasan por este fichero ni por los logs.
#   - Las imágenes se etiquetan con el commit: cada revisión es trazable y
#     reversible (`gcloud run services update-traffic ... --to-revisions`).
# ============================================================================

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: bezhas
  _TAG: manual
  _WWW_URL: https://www.bezhas.com
  _API_URL: https://api.bezhas.com
  _WS_URL: wss://api.bezhas.com
  _MCP_URL: https://mcp.bezhas.com
  _INGRESS: internal-and-cloud-load-balancing
  _SA_BACKEND: bezhas-backend-run
  _SA_FRONTEND: bezhas-frontend-run
  _SA_MCP: bezhas-mcp-run
  _VPC_NETWORK: default
  _VPC_SUBNET: default
  # Direcciones públicas de contratos en Polygon (no son secretos: van al
  # bundle del navegador).
  _POLYGON_CHAIN_ID: "137"
  # Red del MCP (mainnet | amoy). Por defecto el MCP usa amoy (testnet), que no
  # es donde viven los contratos de producción (chain 137).
  _NETWORK_MODE: mainnet
  _BEZCOIN_ADDRESS: "0xEcBa873B534C54DE2B62acDE232ADCa4369f11A8"
  _QUALITY_ORACLE_ADDRESS: "0x0C4291c40Aaaded2207b3C3118B6afc9cc10EBE7"
  _QUALITY_ESCROW_ADDRESS: "0x5101ab251f17F8948069b74fd59eCf2C150b29EF"
  _STAKING_POOL_ADDRESS: "0xf3fcfC9E19a7Cddf37c14bb74a7510D5005ce271"
  _NFT_ADDRESS: "0xDD8Dc31CC5FCe4367961ec6112b52ECaeE2D382a"
  _RWA_FACTORY_ADDRESS: "0xa7e6656eFA45EB59ca247aa15F883330692C0d9A"
  _PROPERTY_NFT_ADDRESS: "0x30Ac874e8BFab0fdD2056C29BA03D2D6a54179F9"
  _TOKEN_SALE_ADDRESS: "0x0fF64DBA574E7c710Ce77d34baA64E3fbb2694A8"
  _GOOGLE_CLIENT_ID: ""
  _GITHUB_CLIENT_ID: ""
  _WALLET_CONNECT_PROJECT_ID: ""
  _STRIPE_PUBLIC_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

timeout: 3000s

steps:
  # ── Construcción (en paralelo) ─────────────────────────────────────────────
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-backend:${_TAG}
      - -f
      - backend/Dockerfile.production
      - backend

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-frontend:${_TAG}
      - -f
      - frontend/Dockerfile.gcp
      - --build-arg=VITE_API_URL=${_API_URL}
      - --build-arg=VITE_WS_URL=${_WS_URL}
      - --build-arg=VITE_MCP_URL=${_MCP_URL}
      - --build-arg=VITE_POLYGON_CHAIN_ID=${_POLYGON_CHAIN_ID}
      - --build-arg=VITE_BEZCOIN_CONTRACT_ADDRESS=${_BEZCOIN_ADDRESS}
      - --build-arg=VITE_QUALITY_ORACLE_ADDRESS=${_QUALITY_ORACLE_ADDRESS}
      - --build-arg=VITE_QUALITY_ESCROW_ADDRESS=${_QUALITY_ESCROW_ADDRESS}
      - --build-arg=VITE_STAKING_POOL_ADDRESS=${_STAKING_POOL_ADDRESS}
      - --build-arg=VITE_NFT_ADDRESS=${_NFT_ADDRESS}
      - --build-arg=VITE_RWA_FACTORY_ADDRESS=${_RWA_FACTORY_ADDRESS}
      - --build-arg=VITE_PROPERTY_NFT_ADDRESS=${_PROPERTY_NFT_ADDRESS}
      - --build-arg=VITE_TOKEN_SALE_ADDRESS=${_TOKEN_SALE_ADDRESS}
      - --build-arg=VITE_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --build-arg=VITE_GITHUB_CLIENT_ID=${_GITHUB_CLIENT_ID}
      - --build-arg=VITE_WALLET_CONNECT_PROJECT_ID=${_WALLET_CONNECT_PROJECT_ID}
      - --build-arg=VITE_STRIPE_PUBLIC_KEY=${_STRIPE_PUBLIC_KEY}
      - .

  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-intelligence:${_TAG}
      - packages/mcp-server

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-migrate:${_TAG}
      - -f
      - deploy/gcp/migrate/Dockerfile.migrate
      - .

  # ── Publicación ────────────────────────────────────────────────────────────
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-backend]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-backend:${_TAG}"]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-frontend:${_TAG}"]

  - id: push-migrate
    name: gcr.io/cloud-builders/docker
    waitFor: [build-migrate]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-migrate:${_TAG}"]

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    waitFor: [build-mcp]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-intelligence:${_TAG}"]

  # ── Despliegue ─────────────────────────────────────────────────────────────
  # secretos_de <servicio>: arma el valor de --set-secrets con los secretos de
  # deploy/gcp/secrets.list que (a) lee ese servicio y (b) tienen al menos una
  # versión activa. Solo consulta metadatos; nunca lee un valor.
  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-mcp]
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        secretos_de() {
          local out=()
          while read -r n s _; do
            [[ -z "$${n:-}" || "$$n" == \#* ]] && continue
            [[ ",$$s," == *",$$1,"* ]] || continue
            if [[ -n "$$(gcloud secrets versions list "$$n" --filter=state=ENABLED --limit=1 --format='value(name)' 2>/dev/null)" ]]; then
              out+=("$$n=$$n:latest")
            fi
          done < deploy/gcp/secrets.list
          (IFS=,; echo "$${out[*]}")
        }
        # TRUST_PROXY_HOPS=2: igual que el backend. Con el ingress limitado al
        # balanceador, X-Forwarded-For llega como «<cliente>, <balanceador>»;
        # con 1 salto todo el tráfico caería en el cupo de la IP del balanceador.
        gcloud run deploy bezhas-intelligence \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-intelligence:${_TAG} \
          --region=${_REGION} \
          --service-account=${_SA_MCP}@$PROJECT_ID.iam.gserviceaccount.com \
          --ingress=${_INGRESS} --allow-unauthenticated \
          --port=8080 --cpu=1 --memory=512Mi \
          --min-instances=0 --max-instances=5 --concurrency=40 --timeout=300 \
          --execution-environment=gen2 \
          --labels=app=bezhas,component=mcp,commit=${_TAG} \
          --set-env-vars=NODE_ENV=production,HTTP_PORT=8080,TRUST_PROXY_HOPS=2,NETWORK_MODE=${_NETWORK_MODE},BACKEND_URL=${_API_URL},OAUTH_ISSUER=${_API_URL},MCP_PUBLIC_URL=${_MCP_URL} \
          --set-secrets="$$(secretos_de mcp)"

  # Migraciones de PostgreSQL ANTES de desplegar el backend: si una falla, el
  # job sale con error y el backend nuevo no llega a desplegarse. Corre dentro
  # de la VPC porque Cloud SQL solo tiene IP privada (01b-database.sh).
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-migrate]
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - bezhas-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-migrate:${_TAG}
      - --region=${_REGION}
      - --service-account=${_SA_BACKEND}@$PROJECT_ID.iam.gserviceaccount.com
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest
      - --max-retries=0
      - --task-timeout=600s
      - --labels=app=bezhas,component=migrate,commit=${_TAG}
      - --execute-now
      - --wait

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-backend, migrate]
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        secretos_de() {
          local out=()
          while read -r n s _; do
            [[ -z "$${n:-}" || "$$n" == \#* ]] && continue
            [[ ",$$s," == *",$$1,"* ]] || continue
            if [[ -n "$$(gcloud secrets versions list "$$n" --filter=state=ENABLED --limit=1 --format='value(name)' 2>/dev/null)" ]]; then
              out+=("$$n=$$n:latest")
            fi
          done < deploy/gcp/secrets.list
          (IFS=,; echo "$${out[*]}")
        }
        # TRUST_PROXY_HOPS=2: detrás del balanceador externo, X-Forwarded-For
        # llega como «<cliente>, <balanceador>» (ver backend/server.js).
        gcloud run deploy bezhas-backend \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-backend:${_TAG} \
          --region=${_REGION} \
          --service-account=${_SA_BACKEND}@$PROJECT_ID.iam.gserviceaccount.com \
          --ingress=${_INGRESS} --allow-unauthenticated \
          --port=8080 --cpu=2 --memory=2Gi \
          --min-instances=1 --max-instances=10 --concurrency=80 --timeout=3600 \
          --execution-environment=gen2 --cpu-boost --session-affinity \
          --network=${_VPC_NETWORK} --subnet=${_VPC_SUBNET} --vpc-egress=private-ranges-only \
          --labels=app=bezhas,component=backend,commit=${_TAG} \
          --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,DISABLE_BULLMQ=true,DISABLE_QUEUE_WORKER=true,AUTH_BYPASS_ENABLED=false,TRUST_PROXY_HOPS=2,FRONTEND_URL=${_WWW_URL},MCP_SERVER_URL=${_MCP_URL},OAUTH_ISSUER=${_API_URL},MCP_PUBLIC_URL=${_MCP_URL} \
          --set-secrets="$$(secretos_de backend)"

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-frontend]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - bezhas-frontend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-frontend:${_TAG}
      - --region=${_REGION}
      - --service-account=${_SA_FRONTEND}@$PROJECT_ID.iam.gserviceaccount.com
      - --ingress=${_INGRESS}
      - --allow-unauthenticated
      - --port=80
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=20
      - --labels=app=bezhas,component=frontend,commit=${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-backend:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-frontend:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-intelligence:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/bezhas-migrate:${_TAG}
