# Marks ai-engine as its own pnpm workspace root (independent install,
# not captured by the repo-root pnpm-workspace.yaml). Security overrides below.
overrides:
  axios: '^1.20.0'
  form-data@<2.5.4: '^2.5.5'
  baseline-browser-mapping@2: '^2.11.0'
  brace-expansion@1: '^1.1.21'
  browserslist@4: '^4.28.7'
  follow-redirects@1: '^1.16.1'
  form-data@4: '^4.0.6'
  js-yaml@3: '^3.15.2'
  proxy-addr@2: '^2.0.8'
  qs@6: '^6.16.0'
