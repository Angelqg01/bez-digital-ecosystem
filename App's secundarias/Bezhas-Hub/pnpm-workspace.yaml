# @chainlink/contracts trae una subdep git (@zksync/contracts) que pnpm 11 bloquea por defecto
blockExoticSubdeps: false

packages:
  - 'backend'
  - 'frontend'
  - 'sdk'
  - 'packages/*'

# Fuerza versiones parcheadas de deps transitivas con CVEs (pnpm audit --prod).
# Rangos ">=X" = mínimo seguro; pnpm resuelve a la última compatible.
overrides:
  axios: '>=1.15.1'
  multer: '>=2.1.0'
  ws: '>=8.21.0'
  mongoose: '>=8.22.1'
  express-rate-limit: '>=8.2.2'
  path-to-regexp: '>=0.1.10'
  nodemailer: '>=7.0.11'
  minimatch: '>=3.1.3'
  picomatch: '>=2.3.2'
  tmp: '>=0.2.6'
  underscore: '>=1.13.8'
  lodash: '>=4.17.24'
  form-data: '>=4.0.6'
  fast-uri: '>=3.1.1'
  defu: '>=6.1.5'
  h3: '>=1.15.6'
  hono: '>=4.12.4'
  effect: '>=3.20.0'
  '@hono/node-server': '>=1.19.10'
  '@openzeppelin/contracts-upgradeable': '>=4.8.3'
