# Scoped workspace: only the shared @bezhas/* packages and the apps that consume them
# via the `workspace:*` protocol (e.g. bez-vision-scan). The other SubApps are
# self-contained (their own node_modules) and intentionally NOT listed here so a
# root install does not relink them.
packages:
  - 'packages/*'
  - 'bez-vision-scan/frontend'
  # bez-wallet declara @bezhas/contracts, platform-sdk y ui-components como
  # `workspace:*`, así que TIENE que estar aquí: fuera del workspace no se puede
  # instalar de ninguna de las dos formas (con --ignore-workspace pnpm no sabe
  # resolver el protocolo `workspace:`, y un install desde la raíz lo ignoraba).
  - 'bez-wallet'
