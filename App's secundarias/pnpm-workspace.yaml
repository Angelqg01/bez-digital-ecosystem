# Scoped workspace: only the shared @bezhas/* packages and the apps that consume them
# via the `workspace:*` protocol (e.g. bez-vision-scan). The other SubApps are
# self-contained (their own node_modules) and intentionally NOT listed here so a
# root install does not relink them.
packages:
  - 'packages/*'
  - 'bez-vision-scan/frontend'
  # Estas cuatro declaran @bezhas/contracts, platform-sdk y ui-components como
  # `workspace:*`, así que TIENEN que estar aquí: fuera del workspace no se
  # pueden instalar de ninguna de las dos formas (con --ignore-workspace pnpm no
  # sabe resolver el protocolo `workspace:`, y un install desde la raíz las
  # ignoraba). Si añades una SubApp que consuma un @bezhas/*, añádela también.
  - 'bez-wallet'
  - 'edge-node-manager'
  - 'gas-tank-manager'
  - 'BZ Prestige'
