packages:
  - 'backend'
  - 'frontend'
  - 'frontend-next'
  - 'api'
  - 'sdk'
  - 'packages/*'

# pnpm 10+ reads settings here, not from .npmrc. Allow the git-resolved
# @zksync/contracts subdependency that pnpm's supply-chain guard blocks by default.
# pnpm-workspace.yaml uses camelCase keys (the error reports "blockExoticSubdeps").
blockExoticSubdeps: false
