# BeZhas — Docker Compose Unificado v2.0
# ─────────────────────────────────────────────────────────────────────────────
# Servicios P0 (ACTIVOS):    redis, messaging-mcp, business-ops
# Servicios P1 (Planificados): lead-mcp, open-webui
# Servicios existentes:      api (3001), mcp-core (4001), postgres, ...
#
# `agent-lib` ya NO es un servicio: la Fase 5 de la fusión lo absorbió en
# el proceso de la API (api/services/agentRuntime.js), donde los 5 agentes se
# cablean una sola vez. Levantarlo aparte duplicaba el runtime y dejaba dos
# fuentes de verdad para /api/agents. Ver docs/PLAN-FUSION-OPERANT.md.
#
# Uso:
#   docker compose up -d                    → arranca todo
#   docker compose up -d redis business-ops → solo P0
#   docker compose logs -f business-ops     → ver logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── INFRAESTRUCTURA BASE ───────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: bezhas-redis
    restart: unless-stopped
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      # Mismo caso que el Postgres de arriba: el 6379 del anfitrión lo ocupa el
      # Redis del proyecto operant. Dentro de la red sigue siendo el 6379.
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - bezhas-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    # `bezhas-postgres` a secas chocaba con el contenedor homónimo del proyecto
    # bezhas-hub (App-nativas/Bezhas-Hub/docker-compose.full.yml): un
    # container_name es global al demonio Docker, no del proyecto, y levantar
    # este compose moría con "Conflict. The container name /bezhas-postgres is
    # already in use". El nombre lleva ahora el proyecto delante.
    #
    # No afecta a la resolución entre servicios: esa usa el nombre de SERVICIO
    # (`postgres`), que es lo que aparece en DATABASE_URL, no el del contenedor.
    container_name: bezhas-blockchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bezhas
      POSTGRES_USER:     bezhas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # El 5432 del anfitrión ya lo ocupa el Postgres del proyecto bezhas-hub,
      # y el arranque moría con "Bind for 0.0.0.0:5432 failed: port is already
      # allocated". Dentro de la red sigue siendo el 5432 de siempre; esto solo
      # cambia por dónde se entra desde fuera. Ajustable con POSTGRES_HOST_PORT.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - bezhas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bezhas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── P0: MESSAGING MCP (Telegram) ──────────────────────────────────────────
  messaging-mcp:
    build:
      context: ./messaging-mcp
      dockerfile: Dockerfile
    container_name: bezhas-messaging-mcp
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:                    ${NODE_ENV:-production}
      REDIS_URL:                   redis://redis:6379
      REDIS_PREFIX:                "bezhas:messaging:"
      TELEGRAM_BOT_TOKEN:          ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALERT_CHAT_ID:      ${TELEGRAM_ALERT_CHAT_ID}
      TELEGRAM_LEADS_CHANNEL_ID:   ${TELEGRAM_LEADS_CHANNEL_ID:-}
      TELEGRAM_AUTHORIZED_USERS:   ${TELEGRAM_AUTHORIZED_USERS}
      BEZHAS_PUBLIC_URL:           ${BEZHAS_PUBLIC_URL:-https://mcp.bez.digital}
      MCP_PORT:                    4002
      RATE_LIMIT_PER_MIN:          20
    ports:
      - "4002:4002"
    networks:
      - bezhas-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── P0: OBSIDIAN MCP (Knowledge Ops + memoria documental) ────────────────
  obsidian-mcp:
    build:
      context: ./obsidian-mcp
      dockerfile: Dockerfile
    container_name: bezhas-obsidian-mcp
    restart: unless-stopped
    environment:
      NODE_ENV:                ${NODE_ENV:-production}
      MCP_PORT:                4007
      OBSIDIAN_VAULT_PATH:     /vault
      OBSIDIAN_MAX_NOTE_BYTES: 512000
    volumes:
      - ./docs/obsidian-vault:/vault
    ports:
      - "4007:4007"
    networks:
      - bezhas-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── BEZHAS API (existente) ────────────────────────────────────────────────
  bezhas-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bezhas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:         ${NODE_ENV:-production}
      DATABASE_URL:     postgresql://bezhas:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/bezhas
      REDIS_URL:        redis://redis:6379
      JWT_SECRET:       ${JWT_SECRET}
      BEZHAS_API_KEY:   ${BEZHAS_API_KEY}
      # config/secrets.js aborta el arranque en producción sin esta variable, y
      # el compose solo pasaba BEZHAS_API_KEY, que es OTRA cosa. Resultado: la
      # API no llegaba a levantar nunca desde este compose —moría en bucle con
      # "FATAL: INTERNAL_API_KEY environment variable is required in
      # production"— y como el contenedor reinicia, se veía como un servicio
      # que "no acaba de arrancar" en vez de como una variable ausente.
      #
      # Es la MISMA clave que usa business-ops para hablar con la API, asi que
      # comparten variable: si divergen, las llamadas internas dan 401.
      INTERNAL_API_KEY: ${OPERANT_ADMIN_KEY:?define OPERANT_ADMIN_KEY en .env}
      # Pagos. Sin estas, la facturación por consumo y el webhook de Stripe
      # fallan al usarse — pero la API arranca igual, que antes no era el caso.
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Nodo de la cadena. SIN esto la API caía al valor por defecto
      # `http://localhost:8545`, que DENTRO del contenedor es el propio
      # contenedor — donde no escucha nadie. De ahí que el indexador nunca
      # alcanzara ningún nodo por mucho que hubiera uno en el host.
      #
      # `host.docker.internal` es el host desde dentro del contenedor; mismo
      # patrón que docker-compose.dev.yml. Apúntalo a la L2 real en producción.
      # Variable PROPIA del contenedor, y no `BEZHAS_L2_RPC_URL` a secas: esa
      # vale `http://localhost:8545` en el .env, que es correcto para procesos
      # del host y erróneo aquí dentro, donde `localhost` es este contenedor.
      # Usándola como valor por defecto nunca se aplicaba, porque la variable
      # existe. Con un nombre distinto, host y contenedor pueden discrepar sin
      # pisarse.
      BEZHAS_L2_RPC_URL: ${BEZHAS_L2_RPC_URL_DOCKER:-http://host.docker.internal:8545}
      RPC_URL:           ${BEZHAS_L2_RPC_URL_DOCKER:-http://host.docker.internal:8545}
      BEZHAS_CHAIN_ID:   ${BEZHAS_CHAIN_ID:-31337}
      # ── OPERANT (SubApp de gestión empresarial autónoma) ──────────────────
      # La API no ejecuta agentes: aprovisiona el tenant, aplica entitlements y
      # cuota, mide el consumo y ancla la auditoría. La ejecución vive en
      # business-ops, al que llama por el puente interno /bridge.
      #
      # La clave es la MISMA que INTERNAL_API_KEY de business-ops (arriba, y en
      # el servicio de abajo): el puente autentica con ella. Si divergen, todas
      # las rutas /api/operant/* devuelven 503 "puente no autorizado".
      OPERANT_API_URL:      http://bezhas-business-ops:4000
      OPERANT_INTERNAL_KEY: ${OPERANT_ADMIN_KEY:?define OPERANT_ADMIN_KEY en .env}
      # Firma las anclas merkle de la auditoría de los agentes. Sin ella la raíz
      # se calcula y se guarda igual (tx_hash nulo) y se reintenta: el tramo no
      # se pierde, solo queda pendiente de notarizar.
      OPERANT_OPERATOR_KEY: ${OPERANT_OPERATOR_KEY:-}

      # ── Panel SuperAdmin y War Room ──
      # El compose no pasaba ninguna de estas, así que dentro del contenedor no
      # existían: el proceso de la API sólo ve lo que se declara aquí, no el
      # .env del host.
      #
      # Credenciales de arranque del SuperAdmin. Son la semilla: en cuanto
      # existe la fila admin_credentials, manda la base de datos.
      ADMIN_USERNAME:      ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_WALLET:        ${ADMIN_WALLET:-}
      ADMIN_2FA_REQUIRED:  ${ADMIN_2FA_REQUIRED:-false}
      # Clave del almacén cifrado (identity_secrets y el secreto TOTP). Sin
      # ella el código genera una clave efímera POR ARRANQUE: en un contenedor,
      # que reinicia solo, eso significa perder lo cifrado en cada reinicio.
      VAULT_KEY:           ${VAULT_KEY:-}
      # Dominio de la cookie de sesión admin. Vacío mientras API y panel
      # comparten host; en producción, .bez.digital.
      COOKIE_DOMAIN:       ${COOKIE_DOMAIN:-}
      # NODE_ENV aquí es production por defecto, y en producción /api/monitor
      # responde 503 sin este token. Sin pasarlo, el War Room queda muerto.
      MONITOR_ACCESS_TOKEN: ${MONITOR_ACCESS_TOKEN:-}

      PORT:             3001
    ports:
      - "3001:3001"
    networks:
      - bezhas-net
    # Direcciones y ABIs de los contratos.
    #
    # La API los lee de `../../smart-contracts`, que queda FUERA del contexto de
    # build (`./api`), así que dentro del contenedor esa ruta no existía. El
    # efecto era total y silencioso: sin direcciones no hay contratos, sin
    # contratos no hay suscripciones, y todo el anclaje devolvía
    # `not_configured` sin una sola queja. El indexador arrancaba con CERO
    # suscripciones y el contenedor se declaraba sano.
    #
    # Se monta `abi/` (1,8 MB) y no `out/` (36 MB): loadABI cae al primero, y
    # el segundo son artefactos de compilación que aquí no pintan nada.
    # En sólo lectura: el contenedor los consume, no los produce.
    volumes:
      - ./smart-contracts/deployments:/smart-contracts/deployments:ro
      - ./smart-contracts/abi:/smart-contracts/abi:ro
    # En Linux `host.docker.internal` no existe por defecto; esto lo resuelve.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health NO EXISTE en esta API: la ruta es /api/health. El healthcheck
      # sondeaba un 404, así que el contenedor salía `unhealthy` de forma
      # permanente aunque la base de datos, Redis y la API estuvieran bien. Se
      # veía como un servicio averiado cuando lo único averiado era la sonda.
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── BUSINESS-OPS / OPERANT ────────────────────────────────────────────────
  # Plano de operación de empresa: los 10 departamentos de agentes.
  #
  # Base de datos PROPIA, y no por gusto: el rol dueño de la base de BeZhas se
  # salta la Row-Level Security, y con él no habría aislamiento entre tenants.
  # OPERANT se niega a arrancar si detecta ese caso. Además necesita pgvector
  # para su memoria semántica, que la imagen alpine de arriba no trae.
  operant-postgres:
    image: pgvector/pgvector:pg16
    container_name: operant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       operant
      POSTGRES_USER:     operant
      POSTGRES_PASSWORD: ${OPERANT_POSTGRES_PASSWORD:?define OPERANT_POSTGRES_PASSWORD en .env}
    volumes:
      - operant-postgres-data:/var/lib/postgresql/data
    networks:
      - bezhas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operant -d operant"]
      interval: 10s
      timeout: 5s
      retries: 10

  business-ops:
    build:
      context: ./business-ops
      dockerfile: Dockerfile
    container_name: bezhas-business-ops
    restart: unless-stopped
    depends_on:
      operant-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      # La aplicación se conecta con operant_app, NUNCA con el dueño: un rol
      # superusuario se salta la RLS y el aislamiento entre tenants desaparece.
      DATABASE_URL: postgresql://operant_app:${OPERANT_APP_PASSWORD:?define OPERANT_APP_PASSWORD en .env}@operant-postgres:5432/operant
      OWNER_DATABASE_URL: postgresql://operant:${OPERANT_POSTGRES_PASSWORD:?define OPERANT_POSTGRES_PASSWORD en .env}@operant-postgres:5432/operant
      PG_APP_PASSWORD: ${OPERANT_APP_PASSWORD:?define OPERANT_APP_PASSWORD en .env}
      # Mismo secreto que firma la API: es lo que hace funcionar el puente de
      # auth (una sesión de BeZhas vale aquí, sin repartir otra credencial).
      JWT_SECRET: ${JWT_SECRET}
      # Con esta clave definida, OPERANT monta el puente /bridge que consume el
      # Gateway de BeZhas (entitlements, cuota, auditoría anclable). Es la misma
      # que OPERANT_INTERNAL_KEY en bezhas-api: si divergen, el puente da 401.
      INTERNAL_API_KEY: ${OPERANT_ADMIN_KEY:?define OPERANT_ADMIN_KEY en .env}
      BRIDGE_TASK_TIMEOUT_MS: ${BRIDGE_TASK_TIMEOUT_MS:-60000}
      # Lectura del stack de BeZhas (solo GET, endpoints públicos).
      BEZHAS_API_URL: http://bezhas-api:3001
      BEZHAS_TENANT_ID: bezhas
      # Avisos por departamento. Sin chat, el aviso se construye y no sale: la
      # aprobación se queda esperando en el panel.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_TOKEN_DIRECTOR: ${TELEGRAM_TOKEN_DIRECTOR}
      TELEGRAM_TOKEN_FINANCE: ${TELEGRAM_TOKEN_FINANCE}
      TELEGRAM_TOKEN_MARKETING: ${TELEGRAM_TOKEN_MARKETING}
      TELEGRAM_TOKEN_DEVOPS: ${TELEGRAM_TOKEN_DEVOPS}
      TELEGRAM_TOKEN_LEGAL: ${TELEGRAM_TOKEN_LEGAL}
      TELEGRAM_CHAT_GENERAL: ${TELEGRAM_CHAT_GENERAL}
      TELEGRAM_CHAT_CEO: ${TELEGRAM_CHAT_CEO}
      TELEGRAM_CHAT_CFO: ${TELEGRAM_CHAT_CFO}
      TELEGRAM_CHAT_CMO: ${TELEGRAM_CHAT_CMO}
      TELEGRAM_CHAT_DEVOPS: ${TELEGRAM_CHAT_DEVOPS}
      TELEGRAM_CHAT_LEGAL: ${TELEGRAM_CHAT_LEGAL}
      HITL_TELEGRAM_CHAT_ID: ${HITL_TELEGRAM_CHAT_ID}
      # Motor de razonamiento. Sin clave ni Ollama arranca en simulado y lo dice.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Ollama corre en el ANFITRIÓN, no en la red de compose: desde el
      # contenedor, localhost es el propio contenedor. De ahí host.docker.internal
      # y el extra_hosts de abajo.
      OLLAMA_URL: ${OLLAMA_URL_CONTAINER:-http://host.docker.internal:11434}
      # Modelos explícitos: el mapa por defecto pide qwen2.5:14b y solo están
      # descargados el 7b y el 3b. Apuntar a un modelo ausente mata el tier.
      TIER_FRONTIER_PROVIDER: ${TIER_FRONTIER_PROVIDER:-ollama}
      TIER_FRONTIER_MODEL: ${TIER_FRONTIER_MODEL:-qwen2.5:7b}
      TIER_MID_PROVIDER: ${TIER_MID_PROVIDER:-ollama}
      TIER_MID_MODEL: ${TIER_MID_MODEL:-qwen2.5:7b}
      TIER_FAST_PROVIDER: ${TIER_FAST_PROVIDER:-ollama}
      TIER_FAST_MODEL: ${TIER_FAST_MODEL:-qwen2.5:3b}
      # Correo propio (Stalwart). Con SMTP_HOST puesto el conector sale de
      # simulado; si el servidor no responde queda `degradado` y /healthz lo
      # dice — nunca da por enviado lo que no salió. Mientras Stalwart siga en
      # modo bootstrap, dejar SMTP_HOST vacío: un simulado honesto es mejor que
      # un modo smtp que falla en cada intento.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Métricas a Prometheus/Grafana, que ya viven en este compose.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Las migraciones se aplican con el rol DUEÑO (crean operant_app y la RLS);
    # el servidor arranca después con el rol de aplicación. Son dos identidades
    # distintas a propósito.
    command: >
      sh -c "DATABASE_URL=\"$$OWNER_DATABASE_URL\" node src/db/migrate.js &&
             node src/server.js"
    ports:
      - "4000:4000"
    networks:
      - bezhas-net

  # ── BEZHAS CORE MCP (existente) ───────────────────────────────────────────
  bezhas-core-mcp:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: bezhas-core-mcp
    restart: unless-stopped
    depends_on:
      bezhas-api:
        condition: service_healthy
    environment:
      PORT:              4001
      BEZHAS_API_URL:    http://bezhas-api:3001
      BEZHAS_API_KEY:    ${BEZHAS_API_KEY}
      REDIS_URL:         redis://redis:6379
    ports:
      - "4001:4001"
    networks:
      - bezhas-net

  # ── P1: OPEN WEBUI (interface Ollama) ─────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: bezhas-open-webui
    restart: unless-stopped
    profiles:
      - p1    # Solo arranca con: docker compose --profile p1 up -d
    depends_on:
      - redis
    environment:
      OLLAMA_BASE_URL:  http://host.docker.internal:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?define WEBUI_SECRET_KEY en .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3100:8080"
    networks:
      - bezhas-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── MONITORING (Grafana + Prometheus) ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: bezhas-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - bezhas-net

  grafana:
    image: grafana/grafana:latest
    container_name: bezhas-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD en .env}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3200:3000"
    networks:
      - bezhas-net

# ── REDES ──────────────────────────────────────────────────────────────────────
networks:
  bezhas-net:
    driver: bridge
    name: bezhas-network

# ── VOLÚMENES ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  postgres-data:
  operant-postgres-data:
  open-webui-data:
  prometheus-data:
  grafana-data:
