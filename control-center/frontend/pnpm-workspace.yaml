# sharp y unrs-resolver traen scripts de build nativos que este paquete no
# necesita. Antes se listaban en `ignoredBuiltDependencies`, que pnpm 11 da por
# deprecado: en cada comando reescribía este fichero con marcadores
# "set this to true or false" y abortaba con ERR_PNPM_IGNORED_BUILDS, de modo que
# ni `pnpm test` ni `pnpm dev` llegaban a arrancar. Decidirlo aquí lo zanja.
allowBuilds:
  # @parcel/watcher aparecio al actualizar las dependencias: es el vigilante
  # nativo opcional de jest/tailwind. Sin su binario ambos caen a sondeo, que es
  # como venia funcionando hasta ahora. Se decide aqui para que el marcador no
  # vuelva a abortar el install con ERR_PNPM_IGNORED_BUILDS.
  '@parcel/watcher': false
  sharp: false
  unrs-resolver: false

# Security overrides: force transitive deps to patched versions.
#
# brace-expansion va acotado POR MAJOR a propósito. El override anterior era
# `brace-expansion: '5.0.6'` a secas, que forzaba la v5 a todos los consumidores
# —incluido minimatch@3, que hace `var expand = require('brace-expansion')` y lo
# llama como función. La v5 ya no exporta una función, así que `pnpm lint`
# reventaba con `TypeError: expand is not a function` antes de analizar una sola
# línea de código.
#
# El CVE de ReDoS está parcheado en 1.1.12, 2.0.2, 3.0.1 y 4.0.1, así que cada
# rama se lleva su propia versión corregida y cada consumidor conserva la API que
# espera.
overrides:
  brace-expansion@1: '^1.1.12'
  brace-expansion@2: '^2.0.2'

  # js-yaml solo entra por eslint > @eslint/eslintrc. Por rama, como en api/:
  # la 4 no es compatible hacia atras con la 3.
  js-yaml@3: '^3.15.1'
  js-yaml@4: '^4.3.1'

  # nanoid llega por postcss (y por next > postcss). Acotado a la rama 3: la 5
  # es ESM puro y postcss@8 la consume con require().
  nanoid@3: '^3.3.18'
  postcss: '^8.5.26'

  # sharp lo arrastra next para optimizar imagenes. Aqui no se compila
  # (allowBuilds lo pone a false), pero el aviso se cierra igual subiendo a la
  # rama parcheada de libvips.
  sharp: '^0.35.0'
  ws: '^8.21.0'

# pnpm 11 convierte "hay builds ignorados" en error (ERR_PNPM_IGNORED_BUILDS), y
# ese error aborta el `install` implícito que precede a CUALQUIER script: `pnpm
# test`, `pnpm lint`, `pnpm dev` y `pnpm build` morían todos antes de empezar.
# Como la decisión sobre sharp y unrs-resolver ya está tomada arriba, aquí sólo se
# devuelve el aviso a su condición de aviso.
strictDepBuilds: false

# Este node_modules se ha instalado históricamente desde Windows, donde pnpm usa
# virtual-store-dir-max-length=60 por defecto (en Linux/macOS es 120). Sin fijarlo,
# un `pnpm install` desde Linux aborta con ERR_PNPM_VIRTUAL_STORE_DIR_MAX_LENGTH_DIFF
# contra un node_modules creado en Windows. 60 es el valor más restrictivo, así que
# vale en las tres plataformas.
virtualStoreDirMaxLength: 60
