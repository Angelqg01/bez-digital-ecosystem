# Marks bezhas-edge-node as its own pnpm workspace root (independent install,
# not captured by the repo-root pnpm-workspace.yaml). Security overrides below.
overrides:
  axios: '^1.20.0'
  form-data@<2.5.4: '^2.5.5'
  follow-redirects@1: '^1.16.1'
  form-data@4: '^4.0.6'
  proxy-addr@2: '^2.0.8'
  qs@6: '^6.16.0'
  ws@8: '^8.21.0'
